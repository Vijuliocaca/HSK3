<script>
const $ = s => document.querySelector(s);
const TABS = [['home', '🏠', 'Inicio'], ['today', '📅', 'Hoy'], ['examMenu', '📝', 'Examen'], ['stats', '📊', 'Progreso']];
let TM = 0;
// botón atrás del móvil: desde cualquier pantalla vuelve al inicio (y no cierra la app)
let depth = 0, skipPop = false, GUARD = '';
addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; return; }
  depth = 0;
  if (GUARD && !confirm('¿Salir del examen? Se perderá el progreso.')) { history.pushState({ a: 1 }, ''); depth = 1; return; }
  GUARD = ''; home();
});
const app = (h, tab) => {
  clearInterval(TM); stopMel();
  if (tab == 'home') { GUARD = ''; if (depth) { depth = 0; skipPop = true; history.back(); } }
  else if (!depth) { history.pushState({ a: 1 }, ''); depth = 1; }
  $('#app').innerHTML = h; scrollTo(0, 0);
  $('#nav').hidden = !tab; document.body.classList.toggle('nonav', !tab);
  if (tab) $('#nav').innerHTML = TABS.map(t => `<button class="${t[0] == tab ? 'on' : ''}" onclick="${t[0]}()"><span>${t[1]}</span>${t[2]}</button>`).join('');
};
// --- accesibilidad: se aplica a todas las pantallas desde aquí ---
// lo clicable que no es un botón se alcanza con Tab, los botones de solo icono tienen nombre, las respuestas se anuncian y el chino lleva su idioma
const ARIA = { '🔊': 'Escuchar', '⭐': 'Marcar o quitar de difíciles', '☆': 'Marcar o quitar de difíciles', '✍️': 'Ver trazos', '←': 'Volver', '✕': 'Salir', '📖': 'Vocabulario', '⚙️': 'Ajustes' };
function a11y() {

const W = [], cnt = {};
function add(s, lv, l) {
  if (!l.trim() || l[0] == '#') return;
  const [h, p, e] = l.split('|'), k = s + lv; cnt[k] = cnt[k] || 0;
  W.push({ id: W.length, h, p, e: FIX[h] || e, l: lv, s, pk0: k + '-' + (cnt[k]++ / 15 | 0) }); // pk0 = lección antigua (solo para migrar el progreso)
}
let lv0 = 0;
RAW.split('\n').forEach(l => { if (l[0] == '#') lv0 = +l.slice(1); else add('a', lv0, l); });
(self.NEW || []).forEach(([lv, t]) => t.split('\n').forEach(l => add('b', lv, l)));
// frases de ejemplo: palabra|frase|pinyin|español
const SENT = {};
(self.SENTR || []).forEach(t => t.split('\n').forEach(l => { const [h, ...r] = l.split('|'); if (r.length == 3) SENT[h] = r; }));

// temas: cada palabra en un solo tema (gana el primero); lo que no exista se ignora
const usada = new Set(), byH = new Map(W.map(w => [w.h, w]));
const TOP = (self.TEMAS || []).map(([e, n, t]) => ({ e, n, ws: t.split(/\s+/).map(h => byH.get(h)).filter(w => w && !usada.has(w.h) && usada.add(w.h)) }));

// lecciones: temas relacionados juntos; lo que no tiene tema va agrupado por carácter compartido. pk = 'x<HSK>-<n>'
const PW = {}, LKEYS = {}, LES = {};
[...new Set(W.map(w => w.l))].forEach(lv => {
  const out = [], used = new Set(); let carry = [], names = [];
  const put = (name, ws) => { if (ws.length) out.push([name, ws]); };
  TOP.forEach(t => {
    const ws = t.ws.filter(w => w.l == lv); ws.forEach(w => used.add(w.id));
    if (ws.length < 8) { carry.push(...ws); if (ws.length) names.push(t.e + ' ' + t.n); if (carry.length >= 8 || names.length >= 3) { put(names.join(' · '), carry); carry = []; names = []; } return; }
    const k = Math.ceil(ws.length / 15);
    for (let i = 0; i < k; i++) put(t.e + ' ' + t.n + (k > 1 ? ' ' + (i + 1) : ''), ws.slice(Math.round(i * ws.length / k), Math.round((i + 1) * ws.length / k)));
  });
  if (carry.length && carry.length < 5 && out.length) { const p = out[out.length - 1]; p[0] += ' · ' + names.join(' · '); p[1].push(...carry); } else put(names.join(' · '), carry); // un resto pequeño se une a la lección anterior
  const g = new Map(); W.filter(w => w.l == lv && !used.has(w.id)).forEach(w => { const c = [...w.h][0]; g.set(c, [...(g.get(c) || []), w]); });
  const rest = [...g.values()].flat();
  const k = Math.max(1, Math.round(rest.length / 14)), gen = [];
  for (let i = 0; i < k; i++) gen.push(['📚 Más vocabulario ' + (i + 1), rest.slice(Math.round(i * rest.length / k), Math.round((i + 1) * rest.length / k))]);
  // en HSK 1-2 lo básico sin tema (pronombres, partículas, verbos comunes) va primero
  LKEYS[lv] = (lv < 3 ? [...gen, ...out] : [...out, ...gen]).filter(l => l[1].length).map(([name, ws], i) => { const k = 'x' + lv + '-' + i; LES[k] = name; PW[k] = ws; ws.forEach(w => w.pk = k); return k; });
});

// --- pinyin: colores de tono y variantes de tono para practicar
const SYL = /(?:zh|ch|sh|[bpmfdtnlgkhjqxzcsryw])?[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+(?:ng|n)?/giu, TONE = {};
['āēīōūǖ', 'áéíóúǘ', 'ǎěǐǒǔǚ', 'àèìòùǜ'].forEach((cs, i) => [...cs].forEach(c => TONE[c] = i + 1));
const toneOf = t => { for (const c of t.toLowerCase()) if (TONE[c]) return TONE[c]; return 5; };
const pc = p => S.set.tones ? p.replace(SYL, m => `<span class=t${toneOf(m)}>${m}</span>`) : p;
const MARK = ['', '̄', '́', '̌', '̀'];
const setTone = (syl, t) => {
  const b = syl.normalize('NFD').replace(/[̄́̌̀]/g, '').normalize('NFC'); if (t == 5) return b;
  const l = b.toLowerCase(); let i = l.search(/[ae]/); if (i < 0) i = l.includes('ou') ? l.indexOf('o') : Math.max(...[...'iouü'].map(v => l.lastIndexOf(v)));
  return (b.slice(0, i + 1) + MARK[t] + b.slice(i + 1)).normalize('NFC');
};
function toneVars(p) { // variantes con otros tonos, para distinguirlos
  const ms = [...p.matchAll(SYL)], out = new Set();
  if (!ms.length) return [];
  for (let k = 0; k < 40 && out.size < 3; k++) {
    const pickI = new Set([Math.random() * ms.length | 0, Math.random() * ms.length | 0]); let r = '', last = 0;
    ms.forEach((m, i) => { r += p.slice(last, m.index); last = m.index + m[0].length; let t = toneOf(m[0]); if (pickI.has(i)) { do t = 1 + Math.random() * 4 | 0; while (t == toneOf(m[0])); } r += setTone(m[0], t); });
    r += p.slice(last); if (r != p) out.add(r);
  }
  return [...out];
}

  const fc = [...Array(7)].map((_, k) => { const a = eod() + k * 864e5, b = a + 864e5; return pl.filter(w => { const r = S.w[w.id]; return r && r.d > a && r.d <= b; }).length; });
  const mx = Math.max(1, ...fc), DN = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  app(`<h1>Hoy</h1><div class=mut>Repaso espaciado de lo que ya estudiaste</div>
    <div class=stats><div class=stat><b>${d.length}</b><span class=mut>pendientes hoy</span></div><div class=stat><b>${pl.length - d.length}</b><span class=mut>al día</span></div></div>
    ${!pl.length ? '<p class=mut>Aún no has estudiado ninguna lección.</p><button class=main onclick="lessons()">Ir a las lecciones</button>'
      : d.length ? `<button class=main style="margin-top:0" onclick="session('mix')">Empezar repaso (${Math.min(20, d.length)} palabras)</button><p class=mut>Mezcla ejercicios según lo bien que sabes cada palabra.</p>`
      : '<div class=prompt><span class=hz>🎉</span>¡Todo repasado por hoy!<small>Vuelve mañana o aprende palabras nuevas.</small></div><button class=main onclick="lessons()">Aprender palabras nuevas</button>'}
    ${Object.keys(S.gram).length ? `<h3>Gramática</h3>${gramDue().length ? `<button class=main style="margin-top:0" onclick="gramRev()">Repasar gramática (${gramDue().length} ${gramDue().length == 1 ? 'punto' : 'puntos'})</button>` : '<p class=mut>✅ Gramática al día.</p>'}` : ''}
    <h3>Próximos 7 días</h3>
    <svg viewBox="0 0 280 80" class=chart>${fc.map((n, i) => `<rect x=${i * 40 + 6} y=${60 - n / mx * 46} width=28 height=${n / mx * 46} rx=2 style="fill:var(--gold)"/><text x=${i * 40 + 20} y=${56 - n / mx * 46} text-anchor=middle>${n || ''}</text><text x=${i * 40 + 20} y=74 text-anchor=middle>${i ? DN[new Date(Date.now() + (i + 1) * 864e5).getDay()] : 'mañana'}</text>`).join('')}</svg>`, 'today');
}

// --- progreso ---
function heat() { // últimas 8 semanas, empezando en lunes
  const hoy = new Date(); hoy.setHours(12); const dow = (hoy.getDay() + 6) % 7, st = new Date(hoy.getTime() - (dow + 49) * 864e5); let r = '';
  for (let c = 0; c < 8; c++) for (let k = 0; k < 7; k++) {
    const d = new Date(st.getTime() + (c * 7 + k) * 864e5); if (d > hoy) continue;
    const n = S.hist[day(d)]?.n || 0, f = n >= S.set.goal ? 'var(--ok)' : n ? 'var(--gold)' : 'var(--bd)';
    r += `<rect x=${c * 22 + 2} y=${k * 17 + 2} width=18 height=14 rx=3 style="fill:${f};opacity:${n ? 1 : .5}"><title>${day(d)}: ${n}</title></rect>`;
  }
  return `<svg viewBox="0 0 176 122" class=chart style="max-width:340px">${r}</svg><div class=mut>Verde: meta cumplida (${S.set.goal}) · Dorado: algo de práctica</div>`;
}
const hb = (l, n, t, c) => `<div class=hbar><span>${l}</span><div class=bar><i style="width:${t ? n / t * 100 : 0}%;${c ? 'background:' + c : ''}"></i></div><b>${n}</b></div>`;
// --- logros y medallas: se calculan del progreso guardado, no necesitan datos nuevos ---
const racha = () => { // racha más larga de días seguidos con práctica
  let best = 0, cur = 0, prev = 0;
  Object.keys(S.hist).filter(d => S.hist[d].n).sort().forEach(d => { const t = new Date(d + 'T12:00').getTime(); cur = t - prev < 1.5 * 864e5 ? cur + 1 : 1; prev = t; best = Math.max(best, cur); });
  return best;
};
const lunes = d => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return day(x); }; // lunes de la semana de d
const semanas = () => { const m = {}; Object.entries(S.hist).forEach(([d, h]) => { if (h.n >= S.set.goal) m[lunes(d)] = (m[lunes(d)] || 0) + 1; }); return m; }; // días con meta por semana
const SEMANA_OK = 5; // días con meta para contar la semana
const LOGROS = [ // [icono, nombre, valor, [bronce, plata, oro], unidad]
  ['🔥', 'Racha de práctica', racha, [3, 7, 30], 'días seguidos'],
  ['📚', 'Palabras estudiadas', () => Object.keys(S.known).length, [100, 500, 2000], 'palabras'],
  ['🧠', 'Palabras dominadas', () => W.filter(w => (S.w[w.id]?.b || 0) >= 4).length, [50, 200, 500], 'palabras'],
  ['🎯', 'Respuestas dadas', () => Object.values(S.hist).reduce((a, h) => a + h.n, 0), [100, 1000, 5000], 'respuestas'],
  ['📅', 'Semanas con meta', () => Object.values(semanas()).filter(n => n >= SEMANA_OK).length, [1, 4, 12], 'semanas'],
  ['📝', 'Exámenes aprobados', () => S.exams.filter(e => e.s[0] + e.s[1] + e.s[2] >= 180).length, [1, 3, 5], 'exámenes'],
  ['🧩', 'Gramática practicada', () => Object.keys(S.gram).length, [10, 40, 100], 'puntos'],
  ['💬', 'Diálogos al 100 %', () => DIAL.filter(d => S.dial?.[d.t] == d.qs.length).length, [3, 10, 20], 'diálogos'],
  ['📖', 'Lecturas al 100 %', () => LECT.filter(d => S.lect?.[d.t] == d.qs.length).length, [3, 10, 20], 'lecturas'],
];
function logros() {
  const MED = ['🥉', '🥈', '🥇'], hoy = day(new Date()), lu = lunes(hoy), sem = semanas(), hechos = sem[lu] || 0, DS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  const dias = DS.map((l, i) => { const d = new Date(lu + 'T12:00'); d.setDate(d.getDate() + i); const k = day(d), n = S.hist[k]?.n || 0;
    return `<div class=stat style="${k == hoy ? 'border:2px solid var(--pri)' : ''}"><b>${n >= S.set.goal ? '✅' : n ? '🔸' : k > hoy ? '·' : '○'}</b><span class=mut>${l}</span></div>`; }).join('');
  const L = LOGROS.map(([e, n, f, ts, u]) => { const v = f(), t = ts.filter(x => v >= x).length, sig = ts[t]; return { e, n, v, ts, u, t, sig }; });
  app(`<div class=top><button class=back onclick="home()">←</button><b>🏅 Logros</b></div>
    <p class=mut>Medallas: <b>${L.reduce((a, l) => a + l.t, 0)}/${L.length * 3}</b> · Mejor racha: <b>${racha()} 🔥</b></p>
    <h3>Esta semana</h3><div class="stats sem">${dias}</div>
    <p class=mut>${hechos} de ${SEMANA_OK} días con meta (${S.set.goal} respuestas) ${hechos >= SEMANA_OK ? '🏅 ¡semana conseguida!' : 'para conseguir la semana'}.</p>
    <h3>Medallas</h3>
    ${L.map(l => `<div class=hbar style="flex-wrap:wrap;gap:.2rem .6rem"><span style="width:auto;font-size:1.3rem">${l.e}</span><span style="flex:1;min-width:8rem"><b>${l.n}</b><br><span class=mut>${l.v} ${l.u}${l.sig ? ' · siguiente: ' + l.sig : ' · ¡completo!'}</span></span><span style="font-size:1.4rem;letter-spacing:.15rem">${MED.map((m, i) => i < l.t ? m : '⚪').join('')}</span>${l.sig ? `<div class=bar style="flex-basis:100%"><i style="width:${Math.min(100, l.v / l.sig * 100)}%"></i></div>` : ''}</div>`).join('')}`, 'home');
}

// --- compartir el progreso: tarjeta dibujada en un canvas, solo con cifras (sin nombre ni datos personales) ---
function tarjetaProgreso() {
  const c = document.createElement('canvas'), g = c.getContext('2d'), F = getComputedStyle(document.documentElement).getPropertyValue('--serif') || 'serif';
  c.width = 1080; c.height = 1350;
  const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
  const txt = (t, x, y, px, col, bold, max = 960) => { g.fillStyle = col; do g.font = `${bold ? 'bold ' : ''}${px--}px ${F}`; while (g.measureText(t).width > max && px > 12); g.fillText(t, x, y); }; // reduce la letra si no cabe
  g.fillStyle = '#f3ead8'; g.fillRect(0, 0, 1080, 1350);
  g.strokeStyle = '#b8892b'; g.lineWidth = 6; g.strokeRect(36, 36, 1008, 1278);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#b3282d'; rr(450, 90, 180, 180, 24); g.fill(); txt('学', 540, 185, 120, '#fff');
  txt('HSK Viju', 540, 350, 88, '#2b1d14', true);
  txt(`Mi progreso · HSK ${Math.max(...S.lv)} · ${new Date().toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric' })}`, 540, 425, 38, '#8a7560');
  const vivo = S.last == day(new Date()) || S.last == day(new Date(Date.now() - 864e5)), vistas = Object.keys(S.known).length, pct = Math.round(vistas / W.length * 100);
  const dom = W.filter(w => (S.w[w.id]?.b || 0) >= 4).length, med = LOGROS.reduce((a, l) => a + l[3].filter(x => l[2]() >= x).length, 0);
  [[vivo ? S.streak : 0, '🔥 días de racha'], [vistas, '📚 palabras estudiadas'], [dom, '🧠 palabras dominadas'], [med, `🏅 medallas de ${LOGROS.length * 3}`]].forEach(([n, l], i) => {
    const x = 80 + (i % 2) * 480, y = 490 + (i >> 1) * 320;
    g.fillStyle = '#fbf6ea'; rr(x, y, 440, 290, 20); g.fill(); g.strokeStyle = '#d9c9a6'; g.lineWidth = 3; g.stroke();
    txt(String(n), x + 220, y + 115, 130, '#b3282d', true); txt(l, x + 220, y + 225, 36, '#2b1d14', false, 400);
  });
  g.fillStyle = '#d9c9a6'; rr(80, 1150, 920, 36, 18); g.fill();
  g.fillStyle = '#b3282d'; if (pct) { rr(80, 1150, Math.max(36, 920 * pct / 100), 36, 18); g.fill(); }
  txt(`${pct} % del vocabulario (${vistas} de ${W.length} palabras)`, 540, 1225, 36, '#2b1d14');
  txt('vijuliocaca.github.io/HSK3', 540, 1285, 32, '#8a7560');
  return c;
}
let PROG;
function compartir() {
  PROG = tarjetaProgreso();
  app(`<div class=top><button class=back onclick="stats()">←</button><b>Compartir mi progreso</b></div>
    <img src="${PROG.toDataURL('image/png')}" alt="Tarjeta con tus cifras de progreso" style="width:100%;max-width:420px;display:block;margin:0 auto;border-radius:8px;border:1px solid var(--bd)">

}
async function enviarProgreso(guardar) {
  const blob = await new Promise(r => PROG.toBlob(r, 'image/png')), f = new File([blob], 'mi-progreso-hsk-viju.png', { type: 'image/png' });
  if (!guardar && navigator.canShare?.({ files: [f] })) { try { return await navigator.share({ files: [f], title: 'HSK Viju', text: 'Mi progreso estudiando chino con HSK Viju' }); } catch (e) { if (e.name == 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}

    <h3>Calendario de actividad</h3>${heat()}

    <h3>Nivel de memoria</h3>${bx.map((n, i) => hb(BN[i], n, p.length, i == 5 ? 'var(--ok)' : '')).join('')}

    <h3>Exámenes</h3>${S.exams.length ? S.exams.slice(-6).reverse().map(e => { const t = e.s[0] + e.s[1] + e.s[2]; return `<div class=hbar><span>${e.d.slice(5)} · HSK ${e.lv}</span><div class=bar><i style="width:${t / 3}%;${t >= 180 ? 'background:var(--ok)' : ''}"></i></div><b>${t}</b></div>`; }).join('') : '<p class=mut>Aún no has hecho ningún examen simulado.</p>'}`, 'stats');

// recordatorio diario: evento .ics que se repite cada día con alarma; hora local del dispositivo (iCalendar exige saltos CRLF)
function recordatorio() {
  const [hh, mm] = (S.set.rem || '19:00').split(':'), pad = n => String(n).padStart(2, '0'), ahora = new Date();
  const ini = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), +hh, +mm); if (ini < ahora) ini.setDate(ini.getDate() + 1);
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//HSK Viju//ES', 'BEGIN:VEVENT', 'UID:recordatorio@hsk-viju', 'DTSTAMP:' + ahora.toISOString().replace(/[-:]|\.\d+/g, ''),
    'DTSTART:' + f(ini), 'DTEND:' + f(new Date(ini.getTime() + 15 * 6e4)), 'RRULE:FREQ=DAILY', 'SEQUENCE:' + (ahora / 1000 | 0), 'SUMMARY:Estudiar chino 学 (HSK Viju)',
    'DESCRIPTION:Tu repaso diario: https://vijuliocaca.github.io/HSK3/', 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:Hora de estudiar chino', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n') + '\r\n';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'recordatorio-hsk-viju.ics'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}
function exportar() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toDisk()], { type: 'application/json' }));
  a.download = 'hsk-viju-' + day(new Date()) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}
async function importar(f) {
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d != 'object' || !d.w || !d.known || !d.lv) throw 0;
    if (!confirm('Esto sustituye tu progreso actual por el del archivo. ¿Continuar?')) return;
    localStorage.hsk3 = JSON.stringify(d); location.reload();
  } catch { alert('El archivo no es una copia de seguridad válida.'); }
}

// --- listas propias: S.listas[nombre] = [hanzi]; por hanzi, así no dependen de la posición de la palabra ---

const LN = () => Object.keys(S.listas), LW = n => (S.listas[n] || []).map(h => byH.get(h)).filter(Boolean);

// --- fiestas chinas: las lunares se calculan con el calendario chino del navegador (Intl) ---
const FIESTAS = (self.FIESTAS || []).flatMap(t => t.split('\n')).map(l => { const [z, e, p, n, r, d, c, s, sp, se] = l.split('|'); return { z, e, p, n, r, d, c, s, sp, se }; });
const FIESTA_FIX = { '2027-02-07': '2027-02-06', '2027-02-21': '2027-02-20' }; // el cálculo se desvía un día en estos casos; fechas comprobadas con fuentes
const qingming = y => Math.floor(y % 100 * .2422 + 4.81) - Math.floor(y % 100 / 4); // vale entre 2001 y 2099
function fiestaFechas(y) {
  const fm = (() => { try { return new Intl.DateTimeFormat('en-u-ca-chinese', { month: 'numeric', day: 'numeric' }); } catch {} })(), out = [];
  for (let d = new Date(y, 0, 1); d.getFullYear() == y; d.setDate(d.getDate() + 1)) {
    const p = fm ? Object.fromEntries(fm.formatToParts(d).map(x => [x.type, x.value])) : {}, fx = FIESTA_FIX[d.toLocaleDateString('sv')];
    const ks = ['G ' + (d.getMonth() + 1) + '/' + d.getDate(), 'L ' + p.month + '/' + p.day];
    if (d.getMonth() == 3 && d.getDate() == qingming(y)) ks.push('Q');
    FIESTAS.forEach(f => { if (ks.includes(f.r)) out.push({ f, d: fx ? new Date(fx + 'T00:00') : new Date(d) }); });
  }
  const ny = out.find(o => o.f.r == 'L 1/1'), ev = FIESTAS.find(f => f.r == 'E');
  if (ny) out.push({ f: ev, d: new Date(ny.d.getFullYear(), ny.d.getMonth(), ny.d.getDate() - 1) });
  return out;
}
let FCACHE = { d: '', v: [] };
function fiestaProx() { // próximos 12 meses, con los días que faltan
  const t = day(new Date()); if (FCACHE.d == t) return FCACHE.v;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const y = hoy.getFullYear();
  FCACHE = { d: t, v: [...fiestaFechas(y), ...fiestaFechas(y + 1)].filter(o => o.d >= hoy && o.d <= hoy.getTime() + 366 * 864e5).sort((a, b) => a.d - b.d).map(o => ({ ...o, n: Math.round((o.d - hoy) / 864e5) })) };
  return FCACHE.v;
}
const nDias = n => n == 1 ? '1 día' : n + ' días';
const fechaEs = d => d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

const MEL = { ctx: null, timers: [], on: null };

  document.querySelectorAll('.ex.now').forEach(e => e.classList.remove('now'));
  const b = $('#mb'); if (b) b.textContent = '🎹 Reproducir la melodía (sin conexión)';

  if (!Ctx) return void alert('Tu navegador no puede reproducir la melodía.');
  const ctx = MEL.ctx = new Ctx(), beat = 60 / s.bpm, SEMI = [0, 0, 2, 4, 5, 7, 9, 11];
  ctx.resume(); MEL.on = i; $('#mb').textContent = '■ Parar la melodía';

  s.mel.forEach((linea, k) => {
    const ini = t; MEL.timers.push(setTimeout(() => { document.querySelectorAll('.ex.now').forEach(e => e.classList.remove('now')); const e = $('#ln' + k); if (e) { e.classList.add('now'); e.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, (ini - ctx.currentTime) * 1000));
    linea.split(' ').forEach(tk => {

const BYC = new Map(), RELA = new Map();

// genera la lista de opciones y gestiona el clic
function opts(el, w, list, label, done) {
  el.insertAdjacentHTML('beforeend', '<div class=opts>' + list.map(o => `<button class=opt>${label(o)}</button>`).join('') + '</div>');
  const bs = [...el.querySelectorAll('.opt')];
  bs.forEach((b, k) => b.onclick = () => {
    bs.forEach((x, j) => { x.disabled = true; if (list[j] === w) x.classList.add('ok'); });
    if (list[k] !== w) b.classList.add('no');
    done(list[k] === w);
    setTimeout(() => el.querySelector('.opt.ok')?.scrollIntoView({ block: 'nearest' }), 60); // que el cuadro de «Siguiente» no tape la respuesta correcta
  });
}
const distract = w => shuffle([w, ...distinct(w, W, x => x.e)]);

// trocea una frase en palabras usando los espacios del pinyin (null si no cuadra con los hanzi)
const segCache = {};
function seg(w) {
  if (w.id in segCache) return segCache[w.id];
  const s = SENT[w.h]; let res = null;
  if (s) {
    const chars = [...s[0]], isP = c => /[，。？！、；：,.?!"“”]/.test(c); let i = 0, ok = true; const out = [];
    for (const t of s[1].split(/\s+/).filter(Boolean)) {
      let n = (t.match(SYL) || []).length; if (!n) continue;
      while (i < chars.length && isP(chars[i])) i++;
      let part = '';
      while (n > 0 && i < chars.length && !isP(chars[i])) { part += chars[i++]; n--; }
      if (n) { ok = false; break; }
      if (t.replace(SYL, '').replace(/[^a-z]/gi, '') == 'r' && chars[i] == '儿') part += chars[i++];
      out.push(part);
    }
    while (ok && i < chars.length) { if (isP(chars[i])) i++; else ok = false; }
    if (ok && out.join('') == chars.filter(c => !isP(c)).join('') && out.length >= 3 && out.length <= 8) res = out;
  }
  return segCache[w.id] = res;
}
// modos que necesitan frase de ejemplo o palabras cortas (para dibujar)
const FILT = { cloze: w => SENT[w.h], sentence: w => SENT[w.h], order: w => seg(w), draw: w => [...w.h].length <= 3 };
const similar = (w, f, key = x => x.h) => shuffle([w, ...distinct(w, W.filter(f), key)]);
function orderUI(el, ch, meaning, done) { // construye una frase con sus trozos (palabras o frases de gramática)
    const bank = shuffle(ch.map((t, i) => i)), put = [];
    el.innerHTML = `<div class=prompt><small>Ordena la frase</small><b>${meaning}</b></div><div class=slot id=sl></div><div class=row id=bk style="justify-content:center"></div><button class=main id=ck disabled>Comprobar</button>`;
    const btn = (i, f) => { const b = document.createElement('button'); b.className = 'chip hz2'; b.textContent = ch[i]; b.onclick = f; return b; };
    const draw = () => {
      $('#sl').replaceChildren(...put.map(i => btn(i, () => { put.splice(put.indexOf(i), 1); draw(); })));
      $('#bk').replaceChildren(...bank.filter(i => !put.includes(i)).map(i => btn(i, () => { put.push(i); draw(); })));
      $('#ck').disabled = put.length != ch.length;
    };
    $('#ck').onclick = () => {
      const good = put.map(i => ch[i]).join('') == ch.join('');
      document.querySelectorAll('#sl button,#bk button,#ck').forEach(b => b.disabled = true);
      $('#sl').classList.add(good ? 'ok' : 'no'); done(good);
    };
    draw();
}

const Q = {

  },
  sentence(el, w, done) {
    const s = SENT[w.h];
    el.innerHTML = `<div class=prompt><button class=main style="width:auto;margin:0 auto" onclick="say(SENT[W[${w.id}].h][0])">🔊 Escuchar la frase</button><small>¿Qué significa?</small></div>`;
    setTimeout(() => say(s[0]), 300);
    opts(el, w, similar(w, x => SENT[x.h], x => SENT[x.h][2]), o => SENT[o.h][2], done);
  },
  pinyin(el, w, done) {

  },
  order(el, w, done) { orderUI(el, seg(w), SENT[w.h][2], done); },

          onLoadCharDataError: () => { $('#dm').textContent = 'Sin datos de trazos para ' + cs[k]; if (!sinDatos++) done(false); } })
          .quiz({ onMistake: () => bad++, onComplete: () => { if (++k < cs.length) setTimeout(next, 600); else if (!sinDatos) done(bad <= cs.length); } });
      };

  },

  },

// en el repaso de hoy: ejercicio según la caja de la palabra
const mixMode = w => { const b = S.w[w.id]?.b || 0; return b <= 1 ? (Math.random() < .5 ? 'cards' : 'choice') : b < 4 ? (Math.random() < .5 ? 'listen' : 'choice') : (Math.random() < .5 ? 'write' : 'listen'); };

// items: palabras fijas (practica tras una lección); sin items, elige las que toca repasar; 'mix' = repaso de hoy
function session(mode, fixed) {
  const mix = mode == 'mix' || mode == 'hard';
  const items = fixed ? shuffle(fixed).slice(0, 10) : mode == 'hard' ? shuffle(hardList().sort((a, b) => (S.w[b.id]?.f || 0) - (S.w[a.id]?.f || 0)).slice(0, 15)) : mix ? due().sort((a, b) => (S.w[a.id]?.d || 0) - (S.w[b.id]?.d || 0)).slice(0, 20) : pick(10, FILT[mode]);
  if (!items.length) return pool().length ? empty('Aún no hay palabras para este modo', 'Estudia más lecciones o prueba otro modo.') : empty();
  let i = 0, ok = 0; const bad = [];
  const step = () => {
    if (i >= items.length) return summary(ok, items.length, bad, () => mode == 'mix' ? today() : session(mode, fixed));
    const w = items[i];
    app(`<div class=play><div class=top><button class=back onclick="home()">✕</button><div class=bar><i style="width:${i / items.length * 100}%"></i></div></div><div id=q></div><div id=fb></div></div>`);
    Q[mix ? mixMode(w) : mode]($('#q'), w, good => {
      grade(w.id, good); good ? ok++ : bad.push(w);
      const s = SENT[w.h];
      $('#fb').innerHTML = `<div class="fb ${good ? 'g' : 'b'}"><b style="font-size:1.4rem">${w.h}</b> ${pc(w.p)} — ${w.e} <button class=back onclick="say('${w.h}')">🔊</button>${s ? `<div class=mut style="margin-top:.3rem">${s[0]} · ${s[2]}</div>` : ''}</div><button class=main id=nx>Siguiente</button>`;
      $('#nx').onclick = () => { i++; step(); };
    });
  };
  step();
}

// entrenamiento de tonos: no usa el progreso, vale con cualquier palabra de una sílaba
const MA = [['妈', 'mā', 'madre'], ['麻', 'má', 'cáñamo'], ['马', 'mǎ', 'caballo'], ['骂', 'mà', 'regañar']];
function tonos() {
  app(`<div class=top><button class=back onclick="home()">←</button><b>Entrenar tonos</b></div>
    <p class=mut>Una misma sílaba cambia de significado según el tono. Toca para oír cada una:</p>
    <div class=grid>${MA.map(([z, p, e]) => `<button class=mode onclick="say('${z}')"><span class=e>🔊</span><span><b style="font-size:1.4rem">${pc(p)}</b><small>${z} · ${e}</small></span></button>`).join('')}</div>
    <button class=main onclick="tonosQ()">Empezar (10 rondas)</button>`, 'home');
}
function tonosQ() {
  const P = W.filter(w => !w.h.includes(' ') && w.p.split(' ').length == 1 && [...w.h].length == 1 && toneOf(w.p) < 5), items = sample(P, 10); let i = 0, ok = 0; const bad = [];
  const step = () => {
    if (i >= items.length) return summary(ok, items.length, bad, tonosQ);
    const w = items[i], t = toneOf(w.p);
    app(`<div class=play><div class=top><button class=back onclick="tonos()">✕</button><div class=bar><i style="width:${i / items.length * 100}%"></i></div></div><div id=q></div><div id=fb></div></div>`);
    const el = $('#q'); el.innerHTML = `<div class=prompt><button class=main style="width:auto;margin:0 auto" onclick="say('${w.h}')">🔊 Escuchar</button><small>¿Qué tono oyes?</small></div>`;
    setTimeout(() => say(w.h), 300);
    opts(el, w, [1, 2, 3, 4].map(k => k == t ? w : { p: setTone(w.p, k) }), o => pc(o.p), good => {
      good ? ok++ : bad.push(w);
      $('#fb').innerHTML = `<div class="fb ${good ? 'g' : 'b'}"><b style="font-size:1.4rem">${w.h}</b> ${pc(w.p)} — ${w.e} <button class=back onclick="say('${w.h}')">🔊</button></div><button class=main id=nx>Siguiente</button>`;
      $('#nx').onclick = () => { i++; step(); };
    });
  };
  step();
}

// diálogos: A y B se alternan; S.dial guarda por título el mejor resultado (no por posición)
const DIAL = (self.DIALS || []).map(([lv, t, ls, qs]) => ({ lv, t, ls: ls.split('\n').map(l => l.split('|')), qs: qs.split('\n').map(l => l.split('|')) }));
function dialogos() {
  S.dial = S.dial || {}; try { speechSynthesis.cancel(); } catch {}
  const hecho = d => S.dial[d.t] == null ? '' : S.dial[d.t] == d.qs.length ? ' ✅' : ` · mejor ${S.dial[d.t]}/${d.qs.length}`;
  app(`<div class=top><button class=back onclick="home()">←</button><b>Diálogos</b></div>` + LEVELS.map(lv => `<h3>HSK ${lv}</h3><div class=list>${DIAL.map((d, i) => d.lv == lv ? `<button class=mode onclick="dialogo(${i})"><span class=e>${d.t.split(' ')[0]}</span><span><b>${d.t.slice(d.t.indexOf(' ') + 1)}</b><small>${d.ls.length} líneas${hecho(d)}</small></span></button>` : '').join('')}</div>`).join(''), 'home');
}
function sayAll(i) { // una voz grave para A y una aguda para B
  try { speechSynthesis.cancel(); DIAL[i].ls.forEach(([, z], j) => { const u = new SpeechSynthesisUtterance(z); u.lang = 'zh-CN'; u.rate = S.set.rate; u.pitch = j % 2 ? 1.35 : .85; speechSynthesis.speak(u); }); } catch {}
}
function dialogo(i) {
  const d = DIAL[i];
  app(`<div class=top><button class=back onclick="dialogos()">←</button><b>${d.t}</b></div>
    <div class=row><button class=chip onclick="sayAll(${i})">🔊 Escuchar todo</button><button class="chip on" onclick="this.classList.toggle('on');$('#dl').classList.toggle('np')">Pinyin</button><button class="chip on" onclick="this.classList.toggle('on');$('#dl').classList.toggle('ne')">Español</button></div>
    <div id=dl>${d.ls.map(([w, z, p, e], j) => `<div class=ex onclick="say(DIAL[${i}].ls[${j}][1])"><div class=zh><b>${w}</b>${z} 🔊</div><div class=p2>${pc(p)}</div><div class=mut>${e}</div></div>`).join('')}</div>
    <button class=main style="margin-top:1rem" onclick="dialQ(${i})">Preguntas de comprensión</button>`, 'home');
  sayAll(i);
}

// cuestionario común de diálogos y lecturas (k = 'dial' | 'lect'); el mejor resultado se guarda en S[k] por título
const KIND = { dial: { L: () => DIAL, q: 'dialQ', one: 'dialogo', all: 'dialogos', say: 'sayAll', n: 'diálogo', m: 'Más diálogos' }, lect: { L: () => LECT, q: 'lectQ', one: 'lectura', all: 'lecturas', say: 'sayLect', n: 'texto', m: 'Más lecturas' } };
const dialQ = i => quiz('dial', i), lectQ = i => quiz('lect', i);
function quiz(k, i) {
  const K = KIND[k], d = K.L()[i]; let n = 0, ok = 0; try { speechSynthesis.cancel(); } catch {}
  const step = () => {
    if (n >= d.qs.length) {
      S[k] = S[k] || {}; S[k][d.t] = Math.max(S[k][d.t] || 0, ok); save();
      return app(`<h1>¡Hecho! 🎉</h1><p style="font-size:1.4rem">${ok}/${d.qs.length} aciertos</p><button class=main onclick="${K.q}(${i})">Repetir</button><button class=opt style="margin-top:.5rem" onclick="${K.one}(${i})">Volver al ${K.n}</button><button class=opt style="margin-top:.5rem" onclick="${K.all}()">${K.m}</button>`);
    }
    const [q, ...r] = d.qs[n], right = { t: r[0] };
    app(`<div class=play><div class=top><button class=back onclick="${K.one}(${i})">✕</button><div class=bar><i style="width:${n / d.qs.length * 100}%"></i></div></div><div id=q></div><div id=fb></div></div>`);
    const el = $('#q'); el.innerHTML = `<div class=prompt><b>${q}</b><button class=chip style="margin-top:.6rem" onclick="${K.say}(${i})">🔊 Oír otra vez</button></div>`;
    opts(el, right, shuffle([right, ...r.slice(1).map(t => ({ t }))]), o => o.t, good => {
      good && ok++;
      $('#fb').innerHTML = `<div class="fb ${good ? 'g' : 'b'}">${good ? '✓ Correcto' : '✗ Era: ' + right.t}</div><button class=main id=nx>Siguiente</button>`;
      $('#nx').onclick = () => { n++; step(); };
    });
  };
  step();
}

// lecturas: cada frase va por palabras (/) alineada con su pinyin; se toca una palabra para ver su ficha
const LECT = (self.LECTS || []).map(([lv, t, ls, qs]) => ({ lv, t, ls: ls.split('\n').map(l => { const [z, p, e] = l.split('|'); return { z: z.split('/'), p: p.split(' '), e }; }), qs: qs.split('\n').map(l => l.split('|')) }));
const GLOS = Object.fromEntries((self.LECTS || []).flatMap(x => x[4].split('\n').filter(Boolean).map(l => l.split('|')))), LPUNT = /[，。！？、：；“”,.!?:;]/g;
function lecturas() {
  S.lect = S.lect || {}; try { speechSynthesis.cancel(); } catch {}
  const hecho = d => S.lect[d.t] == null ? '' : S.lect[d.t] == d.qs.length ? ' ✅' : ` · mejor ${S.lect[d.t]}/${d.qs.length}`;
  app(`<div class=top><button class=back onclick="home()">←</button><b>Lecturas</b></div>` + LEVELS.map(lv => `<h3>HSK ${lv}</h3><div class=list>${LECT.map((d, i) => d.lv == lv ? `<button class=mode onclick="lectura(${i})"><span class=e>${d.t.split(' ')[0]}</span><span><b>${d.t.slice(d.t.indexOf(' ') + 1)}</b><small>${d.ls.length} frases${hecho(d)}</small></span></button>` : '').join('')}</div>`).join(''), 'home');
}
function sayLect(i) {
  try { speechSynthesis.cancel(); LECT[i].ls.forEach(l => { const u = new SpeechSynthesisUtterance(l.z.join('')); u.lang = 'zh-CN'; u.rate = S.set.rate; speechSynthesis.speak(u); }); } catch {}
}
function lectura(i) {
  const d = LECT[i];
  app(`<div class=top><button class=back onclick="lecturas()">←</button><b>${d.t}</b></div>
    <div class=row><button class=chip onclick="sayLect(${i})">🔊 Escuchar todo</button><button class="chip on" onclick="this.classList.toggle('on');$('#lc').classList.toggle('np')">Pinyin</button><button class="chip on" onclick="this.classList.toggle('on');$('#lc').classList.toggle('ne')">Español</button></div>
    <p class=mut>Toca una palabra para ver su ficha.</p>
    <div id=lc>${d.ls.map((l, j) => `<div class=ex style="cursor:default">${l.z.map((z, k) => `<span class=wd onclick="palabra(${i},${j},${k})"><small>${l.p[k]}</small>${z}</span>`).join('')}<button class=back onclick="say(LECT[${i}].ls[${j}].z.join(''))">🔊</button><div class=mut>${l.e}</div></div>`).join('')}</div>
    <div id=fi></div>
    <button class=main style="margin-top:1rem" onclick="lectQ(${i})">Preguntas de comprensión</button>`, 'home');
}
function palabra(i, j, k) {
  const l = LECT[i].ls[j], h = l.z[k].replace(LPUNT, ''), w = byH.get(h);
  $('#fi').innerHTML = `<div class="fb g"><b style="font-size:1.6rem">${h}</b> ${pc(l.p[k].replace(LPUNT, ''))} — ${w ? w.e : GLOS[h] || ''} <button class=back onclick="say('${h}')">🔊</button>${w ? `<button class=back id=st onclick="star(${w.id})">${S.star[w.id] ? '⭐' : '☆'}</button>` : ''}</div>`;
  $('#fi').scrollIntoView({ block: 'nearest' }); say(h);
}

// contrarreloj: 60 segundos de preguntas de elegir traducción
function speed() {
  const items = shuffle(pool()); let i = 0, ok = 0, n = 0, left = 60; const bad = [];
  app(`<div class=play><div class=exh><span class=sec>⏱️ Contrarreloj</span><span class=tm id=tm>60</span></div>
    <div class=top><button class=back onclick="home()">✕</button><div class=bar><i id=sb style="width:100%"></i></div><b id=sc>0</b></div><div id=q></div></div>`);
  const end = () => {
    clearInterval(TM);
    const prev = S.best || 0, best = S.best = Math.max(prev, ok); save();
    summary(ok, n, bad, speed);
    $('#app').insertAdjacentHTML('afterbegin', `<div class=mut>Récord: ${best} aciertos${ok > prev ? ' 🏆 ¡nuevo!' : ''}</div>`);
  };
  const q = () => {
    if (left <= 0 || !$('#tm')) return; // salió de la pantalla
    const w = items[i++ % items.length];
    Q.choice($('#q'), w, good => { grade(w.id, good); n++; good ? ok++ : bad.push(w); $('#sc').textContent = ok; setTimeout(q, good ? 250 : 800); });
  };
  TM = setInterval(() => { left--; $('#tm').textContent = left; $('#sb').style.width = left / 60 * 100 + '%'; if (left <= 0) end(); }, 1000);
  q();
}

function matchGame(fixed) {
  const items = fixed ? shuffle(fixed).slice(0, 15) : pick(10), bad = [], rounds = Math.ceil(items.length / 5); let ok = 0, r = 0;
  const round = () => {
    if (r >= rounds) return summary(ok, items.length, bad, () => matchGame(fixed));
    const ws = items.slice(r * 5, r * 5 + 5), err = new Set(), R = shuffle(ws); let cur = null, left = ws.length;
    app(`<div class=play><div class=top><button class=back onclick="home()">✕</button><div class=bar><i style="width:${r / rounds * 100}%"></i></div></div>
      <div class=match>${ws.map((w, i) => `<button class=cell data-i=${w.id} data-s=l><span class=hz2>${w.h}</span><small class=mut>${pc(w.p)}</small></button><button class=cell data-i=${R[i].id} data-s=r>${R[i].e}</button>`).join('')}</div></div>`);
    const word = id => ws.find(w => w.id == id);
    document.querySelectorAll('.cell').forEach(b => b.onclick = () => {
      if (b.dataset.s == 'l') say(word(b.dataset.i).h);
      if (!cur || cur.dataset.s == b.dataset.s) { cur?.classList.remove('sel'); cur = b; b.classList.add('sel'); return; }
      const a = cur; cur = null;
      if (a.dataset.i == b.dataset.i) {
        [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); x.disabled = true; });
        if (!--left) { ws.forEach(w => { const good = !err.has(w.id); grade(w.id, good); good ? ok++ : bad.push(w); }); setTimeout(() => { if ($('.match')) { r++; round(); } }, 600); }
      } else {
        err.add(+(a.dataset.s == 'l' ? a : b).dataset.i);
        [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('no', 'shake'); });
        setTimeout(() => [a, b].forEach(x => x.classList.remove('no', 'shake')), 450);
      }
    });
  };
  round();
}

const row = w => `<div onclick="detail(${w.id})"><b>${w.h}</b><i>${pc(w.p)}</i><span>${w.e}</span><span class=box style="${(S.w[w.id]?.b || 0) >= 4 ? 'background:var(--ok)' : S.known[w.id] ? 'background:var(--pri)' : ''}"></span></div>`;
let LF = 'all'; // filtro del vocabulario: all | done | new | hard
function list(f) {
  if (f) LF = f; BACK = 'list()';
  const hard = new Set(hardList().map(w => w.id));
  const pass = { all: () => 1, done: w => S.known[w.id], new: w => !S.known[w.id], hard: w => hard.has(w.id) }[LF];
  const chip = (k, t) => `<button class="chip ${LF == k ? 'on' : ''}" onclick="list('${k}')">${t}</button>`;
  const draw = q => {
    q = q.trim().toLowerCase(); const nq = nrm(q);
    const hit = W.filter(w => sel(w) && pass(w) && (!q || w.h.includes(q) || (nq && nrm(w.p).includes(nq)) || w.e.toLowerCase().includes(q)));
    $('#cnt').textContent = hit.length + (hit.length == 1 ? ' palabra' : ' palabras');
    $('#l').innerHTML = hit.slice(0, 300).map(row).join('') + (hit.length > 300 ? `<p class=mut style="text-align:center">Se muestran 300 de ${hit.length}: usa el buscador para encontrar más.</p>` : '') + (!hit.length ? '<p class=mut style="text-align:center">No hay palabras con este filtro.</p>' : '');
  };
  app(`<div class=top><button class=back onclick="home()">←</button><input type=search id=s placeholder="Buscar hanzi, pinyin o español"></div>
    <div class=row style="margin:.6rem 0">${chip('all', 'Todas')}${chip('done', 'Estudiadas')}${chip('new', 'Sin estudiar')}${chip('hard', '⭐ Difíciles')}</div>
    <div class=mut id=cnt></div><div class=list id=l></div>`);
  $('#s').oninput = e => draw(e.target.value); draw('');
}

// --- examen simulado (estilo HSK: 听力 / 阅读 / 书写, 100 puntos cada parte, aprobado 180/300) ---
const SECN = ['听力 · Comprensión auditiva', '阅读 · Comprensión lectora', '书写 · Escritura'];
function examMenu() {
  app(`<h1>Examen simulado</h1><div class=mut>30 preguntas · 30 minutos · 3 partes · aprobado con 180/300</div>
    <h3>HSK del examen</h3>
    <div class=row>${LEVELS.map(n => `<button class="chip ${S.exLv == n ? 'on' : ''}" onclick="S.exLv=${n};save();examMenu()">HSK ${n}</button>`).join('')}</div>
    <p class=mut>Usa solo el vocabulario de ese HSK, hayas estudiado las lecciones o no, y ninguna palabra se repite en el examen. Incluye frases de ejemplo en todos los HSK.</p>
    <h3>Fecha de tu examen</h3>
    <div class=row><input type=date value="${S.exam?.d || ''}" min="${day(new Date())}" onchange="setExam(this.value)"><button class=chip onclick="setExam('')">Quitar</button></div>
    <p class=mut>${examDays() == null ? 'Pon la fecha y el inicio mostrará la cuenta atrás con tu ritmo diario.' : examDays() < 0 ? 'Esa fecha ya pasó: quítala o pon otra.' : 'La cuenta atrás sale en el inicio.'}</p>
    <button class=main onclick="exam(S.exLv)">Empezar examen</button>
    <h3>Últimos resultados</h3>
    ${S.exams.length ? S.exams.slice(-5).reverse().map(e => { const t = e.s[0] + e.s[1] + e.s[2]; return `<div class=hbar><span>${e.d} · HSK ${e.lv}</span><div class=bar><i style="width:${t / 3}%;${t >= 180 ? 'background:var(--ok)' : ''}"></i></div><b>${t}</b></div>`; }).join('') : '<p class=mut>Sin exámenes todavía.</p>'}`, 'examMenu');
}
function buildExam(lv) {
  const P = W.filter(w => w.l == lv), PS = P.filter(w => SENT[w.h]), used = new Set();
  const take = (a, n) => sample(a.filter(w => !used.has(w.id)), n).map(w => (used.add(w.id), w)); // sin repetir palabras en el examen
  const dis = (w, k) => shuffle([w, ...distinct(w, P, x => x[k])]);
  const hz = o => `<span class=hz2>${o.h}</span>`, Qs = [];
  const mk = (s, w, o) => Qs.push({ s, w, ...o });
  // 听力
  take(P, 5).forEach(w => mk(0, w, { audio: w.h, q: '¿Qué significa lo que oyes?', opts: dis(w, 'e'), lab: o => o.e }));
  if (PS.length >= 8) take(PS, 5).forEach(w => mk(0, w, { audio: SENT[w.h][0], q: 'Escucha la frase: ¿qué dice?', opts: shuffle([w, ...distinct(w, PS, x => SENT[x.h][2])]), lab: o => SENT[o.h][2] }));
  else take(P, 5).forEach(w => mk(0, w, { audio: w.h, q: '¿Qué palabra oyes?', opts: dis(w, 'h'), lab: hz }));
  // 阅读
  if (PS.length >= 8) take(PS, 5).forEach(w => { const s = SENT[w.h]; mk(1, w, { q: 'Completa la frase', html: `<span class=hz2 style="line-height:1.5">${s[0].replaceAll(w.h, '＿＿')}</span><small>${s[2]}</small>`, opts: dis(w, 'h'), lab: hz }); });
  else take(P, 5).forEach(w => mk(1, w, { q: '¿Qué significa?', html: `<span class=hz>${w.h}</span>`, opts: dis(w, 'e'), lab: o => o.e }));
  take(P, 5).forEach(w => mk(1, w, { q: '¿Cuál es el pinyin correcto?', html: `<span class=hz>${w.h}</span>`, opts: dis(w, 'p'), lab: o => o.p }));
  // 书写
  take(P, 5).forEach(w => mk(2, w, { q: 'Elige los caracteres correctos', html: `<b>${w.e}</b><small>${w.p}</small>`, opts: dis(w, 'h'), lab: hz }));
  take(P, 5).forEach(w => mk(2, w, { q: 'Escribe el pinyin', html: `<span class=hz>${w.h}</span><small>${w.e}</small>`, type: 1 }));
  return Qs;
}
function exam(lv) {
  GUARD = 'examen';
  const Qs = buildExam(lv), res = []; let i = 0, left = 30 * 60;
  const fin = () => {
    if (GUARD != 'examen') return; // ya terminó o salió
    clearInterval(TM); GUARD = '';
    const sc = [0, 1, 2].map(s => Math.round(Qs.filter((q, k) => q.s == s && res[k]).length / Qs.filter(q => q.s == s).length * 100)), tot = sc[0] + sc[1] + sc[2];
    S.exams.push({ d: day(new Date()), lv, s: sc }); S.exams = S.exams.slice(-30); save();
    const wrong = Qs.filter((q, k) => !res[k]);
    window.wrongW = [...new Map(wrong.map(q => [q.w.id, q.w])).values()];
    app(`<div style="text-align:center"><h1 style="justify-content:center">Resultado · HSK ${lv}</h1><div class=score>${tot}<span class=mut style="font-size:1.2rem"> / 300</span></div>
      <div style="margin:.8rem 0"><span class=stamp>${tot >= 180 ? '合格 · Aprobado' : '不合格 · Suspenso'}</span></div></div>
      ${sc.map((n, s) => `<div class=hbar><span style="width:9rem">${SECN[s].split(' · ')[0]}</span><div class=bar><i style="width:${n}%;${n >= 60 ? 'background:var(--ok)' : ''}"></i></div><b>${n}</b></div>`).join('')}
      ${wrong.length ? `<h3>Para repasar (${wrong.length})</h3><div class=list>${wrong.map(q => `<div><b>${q.w.h}</b><i>${q.w.p}</i><span>${q.w.e}</span></div>`).join('')}</div><button class=main onclick="session('choice',wrongW)">Practicar los fallos</button>` : '<p>¡Perfecto, ninguna falta! 🎉</p>'}
      <button class=opt style="margin-top:.5rem" onclick="exam(${lv})">Nuevo examen</button><button class=opt style="margin-top:.5rem" onclick="home()">Inicio</button>`, 'examMenu');
  };
  const next = good => { if (GUARD != 'examen') return; res[i] = good; i++; i < Qs.length ? show() : fin(); };
  const show = () => {
    const q = Qs[i];
    app(`<div class=play><div class=exh><span class=sec>${SECN[q.s]}</span><span class=tm id=tm></span></div>
      <div class=top><button class=back onclick="confirm('¿Salir del examen? Se perderá el progreso.')&&home()">✕</button><div class=bar><i style="width:${i / Qs.length * 100}%"></i></div><span class=mut>${i + 1}/${Qs.length}</span></div>
      <div class=prompt><b style="font-size:1rem;color:var(--mut)">${q.q}</b>${q.audio ? '<button class=main id=pl style="width:auto;margin:0 auto">🔊 Escuchar</button>' : ''}${q.html || ''}</div><div id=q></div></div>`);
    const tick = () => { $('#tm').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
    tick(); TM = setInterval(() => { left--; tick(); if (left <= 0) fin(); }, 1000);
    if (q.audio) { $('#pl').onclick = () => say(q.audio); setTimeout(() => say(q.audio), 300); }
    const el = $('#q');
    if (q.type) {
      el.innerHTML = `<input type=text id=in autocomplete=off autocapitalize=off placeholder="pinyin (los tonos son opcionales)"><button class=main id=go>Siguiente</button>`;
      const go = () => next(nrm($('#in').value) == nrm(q.w.p));
      $('#go').onclick = go; $('#in').onkeydown = e => e.key == 'Enter' && go(); $('#in').focus();
    } else {
      el.innerHTML = '<div class=opts>' + q.opts.map(o => `<button class=opt>${q.lab(o)}</button>`).join('') + '</div>';
      [...el.querySelectorAll('.opt')].forEach((b, k, bs) => b.onclick = () => { bs.forEach(x => x.disabled = true); b.classList.add('pk'); setTimeout(() => next(q.opts[k] === q.w), 250); });
    }
  };
  show();
}

home();
if ('serviceWorker' in navigator) {
  const tenia = !!navigator.serviceWorker.controller; // en la primera instalación no avisamos
  navigator.serviceWorker.register('sw.js').then(r => { document.addEventListener('visibilitychange', () => document.hidden || r.update().catch(() => {})); }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tenia) $('#upd').hidden = false; });
}
