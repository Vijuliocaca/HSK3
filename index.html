const $ = s => document.querySelector(s);
const TABS = [['home', 'house', 'Inicio'], ['today', 'calendar-days', 'Hoy'], ['examMenu', 'clipboard-check', 'Examen'], ['stats', 'chart-column', 'Progreso']];
const vSW = t => (/const V = '([^']+)'/.exec(t) || [])[1]; // la versión que declara un sw.js
const APP_V = 'hsk3-v211'; // versión de este código: debe coincidir con V de sw.js (la comprueba tests/datos.js) y se ve al final de Ajustes
let TM = 0;
// botón atrás del móvil: sube un nivel (a la pantalla a la que lleva el botón ← / ✕ de la pantalla actual; sin él, al inicio); solo desde el inicio cierra la app.
// El historial tiene una entrada por cada pantalla nueva abierta con un toque (depth = entradas sobre el inicio). Atrás NUNCA añade entradas: Chrome omite las que se añaden sin
// interacción del usuario y la app se cerraba al volver a una lista. Al llegar al inicio, home() borra las entradas que sobren con history.go.
let depth = 0, skipPop = false, GUARD = '', INICIO = false, BAJANDO = false, PANT = null; // INICIO: lo pone home() justo antes de pintar; otras pantallas usan la pestaña 'home' solo para la barra y sí deben añadir entrada al historial. BAJANDO: se está subiendo con atrás. PANT: título de la pantalla actual (null = inicio)
function atras() { const b = document.querySelector('#app .top .back'); b ? b.click() : home(); } // al subir, la pantalla padre vuelve a añadir su entrada al historial (app() la añade porque depth = 0)
addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; return; }
  depth = Math.max(0, depth - 1);
  if (GUARD) { if (!confirm('¿Salir del examen? Se perderá el progreso.')) { history.pushState({ a: 1 }, ''); depth++; return; } GUARD = ''; return home(); }
  BAJANDO = true; try { atras(); } finally { BAJANDO = false; }
});
// posición de cada pantalla al salir de ella: al volver con ← / ✕ o con el botón atrás se recupera (así la lista de lecturas o de diálogos queda a la altura de la que abriste)
const SCR = {}; let VOLVIENDO = false;
try { history.scrollRestoration = 'manual'; } catch {} // si no, el navegador recoloca la página tras popstate y pisa la posición que guardamos
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#app .top .back')) { VOLVIENDO = true; setTimeout(() => { VOLVIENDO = false; }); } }, true);
const app = (h, tab) => {
  clearInterval(TM); stopMel();
  const inicio = tab == 'home' && INICIO; INICIO = false;
  if (PANT !== null) SCR[PANT] = window.scrollY || 0;
  $('#app').innerHTML = h;
  const h1 = $('#app h1'), t = (h1 ? [...(h1.childNodes || [])].filter(n => n.nodeType == 3).map(n => n.textContent).join('') : $('#app .top > b')?.textContent || '').trim();
  if (t && t != $('#sr').textContent) $('#sr').textContent = t; // el lector de pantalla anuncia la pantalla nueva
  document.title = t && t != 'HSK Viju' ? t + ' · HSK Viju' : 'HSK Viju';
  scrollTo(0, (BAJANDO || VOLVIENDO) && SCR[t] != null ? SCR[t] : 0); VOLVIENDO = false;
  if (inicio) { GUARD = ''; PANT = null; Object.keys(SCR).forEach(k => delete SCR[k]); if (depth) { const d = depth; depth = 0; skipPop = true; history.go(-d); } }
  else if (!BAJANDO && t !== PANT) { for (let k = PANT === null ? 3 : 1; k > 0; k--) { history.pushState({ a: 1 }, ''); depth++; } PANT = t; } // pantalla nueva: una entrada (volver a pintar la misma, p. ej. al cambiar una ayuda, no añade); al salir del inicio, 3 de reserva por si se abre una pantalla de nivel profundo (así atrás nunca llega al inicio sin entradas)
  else { PANT = t; if (BAJANDO && !depth) { history.pushState({ a: 1 }, ''); depth = 1; } } // red de seguridad: pantalla sin entradas debajo
  $('#nav').hidden = !tab; document.body.classList.toggle('nonav', !tab);
  if (tab) $('#nav').innerHTML = TABS.map(t => `<button class="${t[0] == tab ? 'on' : ''}" ${t[0] == tab ? 'aria-current="page"' : ''} onclick="${t[0]}()"><span aria-hidden="true">${ico(t[1])}</span>${t[2]}</button>`).join('');
};
// --- accesibilidad: se aplica a todas las pantallas desde aquí ---
// lo clicable que no es un botón se alcanza con Tab, los botones de solo icono tienen nombre, las respuestas se anuncian y el chino lleva su idioma
const ARIA = { '🔊': 'Escuchar', '★': 'Marcar o quitar de difíciles', '☆': 'Marcar o quitar de difíciles', '←': 'Volver', '✕': 'Salir' };
function a11y() {
  document.querySelectorAll('#app [onclick]:not(button):not(a):not(input):not(summary)').forEach(e => { e.tabIndex = 0; e.setAttribute('role', 'button'); });
  document.querySelectorAll('#app button:not([aria-label])').forEach(b => { const t = b.textContent.trim(), a = ARIA[t] || (!t && b.querySelector('.spk') ? 'Escuchar' : ''); if (a) b.setAttribute('aria-label', a); });
  document.querySelectorAll('#fb').forEach(e => e.setAttribute('aria-live', 'polite'));
  document.querySelectorAll('#app span.sg').forEach(e => e.setAttribute('aria-hidden', 'true'));
  document.querySelectorAll('#app .hz, #app .hz2, #app .zh, #app .list b, #app .wd, #app .gpat, #app .zhs').forEach(e => e.lang = 'zh-CN');

// el 🔊 de las plantillas se dibuja como icono SVG; el observador actúa antes de pintar, así que el emoji no llega a verse
// iconos de línea de iconos.js (Lucide); siempre decorativos, el nombre lo da el texto o el aria-label del botón
const ico = n => `<svg class=i viewBox="0 0 24 24" aria-hidden="true">${(self.ICONS || {})[n] || ''}</svg>`;
const SPK = ico('volume-2').replace('class=i', 'class="i spk"');
function speakers(root) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.data.includes('🔊') ? 1 : 3 }), ns = [];
  while (tw.nextNode()) ns.push(tw.currentNode);
  ns.forEach(n => { const f = document.createDocumentFragment(), t = document.createElement('template'); t.innerHTML = SPK;
    n.data.split('🔊').forEach((p, i) => { if (i) f.append(t.content.cloneNode(true)); if (p) f.append(p); }); n.replaceWith(f); });
}
let A11Y;
new MutationObserver(() => { speakers($('#app')); clearTimeout(A11Y); A11Y = setTimeout(a11y, 40); }).observe($('#app'), { childList: true, subtree: true });
document.addEventListener('keydown', e => { // teclado: Intro o Espacio activan lo clicable; 1-9 eligen opción; Intro pasa a «Siguiente»
  const t = e.target, campo = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if ((e.key == 'Enter' || e.key == ' ') && t.getAttribute?.('role') == 'button' && t.tagName != 'BUTTON') { e.preventDefault(); t.click(); }
  else if (!campo && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-9]$/.test(e.key)) document.querySelectorAll('#app .opts .opt:not(:disabled)')[+e.key - 1]?.click();
  else if (e.key == 'Enter' && !/BUTTON|A|INPUT|SUMMARY/.test(t.tagName) && $('#nx')) $('#nx').click();
});

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const distinct = (w, list, key, n = 3) => { const seen = new Set([key(w)]); return shuffle(list).filter(x => x.id != w.id && !seen.has(key(x)) && seen.add(key(x))).slice(0, n); }; // distractores con texto distinto entre sí y del correcto
const nrm = s => s.normalize('NFD').replace(/[̀-ͯ0-9\s'’·.-]/g, '').toLowerCase().replace(/v/g, 'u');
const say = t => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = S.set.rate; speechSynthesis.speak(u); } catch {} };

// --- datos: s='a' lista HSK 2.0, s='b' palabras añadidas del HSK 3.0 nuevo; pk = lección (ver abajo) ---
const W = [], cnt = {};
function add(s, lv, l) {
  if (!l.trim() || l[0] == '#') return;
  const [h, p, e] = l.split('|'), k = s + lv; cnt[k] = cnt[k] || 0;
  W.push({ id: W.length, h, p, e: FIX[h] || e, l: lv, s, pk0: k + '-' + (cnt[k]++ / 15 | 0) }); // pk0 = lección antigua (solo para migrar el progreso)

// Curva del olvido: la retención de una palabra cae como R = 0,9^(t/s), con s = «estabilidad» en días (a los s días se recuerda el 90 %).

// --- fiestas chinas: las lunares se calculan con el calendario chino del navegador (Intl) ---
const FIESTAS = (self.FIESTAS || []).flatMap(t => t.split('\n')).map(l => { const [z, p, n, r, d, c, s, sp, se] = l.split('|'); return { z, p, n, r, d, c, s, sp, se }; });
const FIESTA_FIX = { '2027-02-07': '2027-02-06', '2027-02-21': '2027-02-20' }; // el cálculo se desvía un día en estos casos; fechas comprobadas con fuentes
const qingming = y => Math.floor(y % 100 * .2422 + 4.81) - Math.floor(y % 100 / 4); // vale entre 2001 y 2099
function fiestaFechas(y) {
  const fm = (() => { try { return new Intl.DateTimeFormat('en-u-ca-chinese', { month: 'numeric', day: 'numeric' }); } catch {} })(), out = [];
  for (let d = new Date(y, 0, 1); d.getFullYear() == y; d.setDate(d.getDate() + 1)) {
    const p = fm ? Object.fromEntries(fm.formatToParts(d).map(x => [x.type, x.value])) : {}, fx = FIESTA_FIX[d.toLocaleDateString('sv')];
    const ks = ['G ' + (d.getMonth() + 1) + '/' + d.getDate(), 'L ' + p.month + '/' + p.day];
    if (d.getMonth() == 3 && d.getDate() == qingming(y)) ks.push('Q');
    FIESTAS.forEach(f => { if (ks.includes(f.r)) out.push({ f, d: fx ? new Date(fx + 'T00:00') : new Date(d) }); });
  }
  const ny = out.find(o => o.f.r == 'L 1/1'), ev = FIESTAS.find(f => f.r == 'E');
  if (ny) out.push({ f: ev, d: new Date(ny.d.getFullYear(), ny.d.getMonth(), ny.d.getDate() - 1) });
  return out;
}
let FCACHE = { d: '', v: [] };
function fiestaProx() { // próximos 12 meses, con los días que faltan; el cálculo lunar (~40 ms) se guarda por día para no repetirlo en cada arranque
  const t = day(new Date()); if (FCACHE.d == t) return FCACHE.v;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0); const y = hoy.getFullYear(), dias = o => ({ ...o, n: Math.round((o.d - hoy) / 864e5) });
  try { const c = JSON.parse(localStorage.hsk3f); if (c.d == t && c.k == FIESTAS.length) return (FCACHE = { d: t, v: c.v.map(([i, s]) => dias({ f: FIESTAS[i], d: new Date(s + 'T00:00') })) }).v; } catch {}
  const v = [...fiestaFechas(y), ...fiestaFechas(y + 1)].filter(o => o.d >= hoy && o.d <= hoy.getTime() + 366 * 864e5).sort((a, b) => a.d - b.d);
  try { localStorage.hsk3f = JSON.stringify({ d: t, k: FIESTAS.length, v: v.map(o => [FIESTAS.indexOf(o.f), o.d.toLocaleDateString('sv')]) }); } catch {}
  return (FCACHE = { d: t, v: v.map(dias) }).v;
}
const nDias = n => n == 1 ? '1 día' : n + ' días';
const fechaEs = d => d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function fiestas() {
  const ls = fiestaProx(), sig = ls[0];
  app(`<div class=top><button class=back onclick="home()">←</button><b>Fiestas chinas</b></div>
    ${sig ? `<div class=exam><b><span class=sgm aria-hidden=true>${ico('calendar-heart')}</span> ${sig.f.z} · ${sig.f.n}</b><div class=mut>${sig.n ? 'Faltan ' + nDias(sig.n) : '¡Es hoy!'} · ${fechaEs(sig.d)}</div></div>` : ''}
    ${ls.map(o => `<details class=resumen><summary><span class=sgm aria-hidden=true>${ico('calendar-heart')}</span> <b>${o.f.z}</b> ${o.f.n}<br><span class=mut>${fechaEs(o.d)} · ${o.n ? 'en ' + nDias(o.n) : 'hoy'}</span></summary>
      <div class=p2>${pc(o.f.p)}</div><p>${o.f.d}</p><p class=mut>${o.f.c}</p>
      <div class=ex onclick="say(FIESTAS[${FIESTAS.indexOf(o.f)}].s)"><div class=zh>${o.f.s} 🔊</div><div class=p2>${pc(o.f.sp)}</div><div class=mut>${o.f.se}</div></div></details>`).join('')}
    <p class=mut>Las fechas lunares se calculan con el calendario chino y pueden variar un día. Los días festivos oficiales los publica cada año el gobierno chino.</p>`, 'home');

      if (n) { ok = false; break; }
      if (t.replace(SYL, '').replace(/[^a-z]/gi, '') == 'r' && chars[i] == '儿') part += chars[i++];

  const items = fixed ? shuffle(fixed).slice(0, 10) : mode == 'risk' ? flojas().slice(0, 20) : mode == 'hard' ? shuffle(hardList().sort((a, b) => (S.w[b.id]?.f || 0) - (S.w[a.id]?.f || 0)).slice(0, 15)) : mix ? due().sort((a, b) => (retencion(S.w[a.id]) ?? 0) - (retencion(S.w[b.id]) ?? 0)) : pick(10, FILT[mode]);
  if (!items.length) return pool().length ? empty('Aún no hay palabras para este modo', 'Estudia más lecciones o prueba otro modo.') : empty();
  let i = 0, ok = 0; const bad = [];
  const step = () => {
    if (i >= items.length) return summary(ok, items.length, bad, () => mode == 'mix' ? today() : session(mode, fixed), mode == 'mix' ? (PLAN ? '<button class=main onclick="planLeccion()">Siguiente: aprender palabras nuevas →</button>' : lecturaDeHoy()) : '');
    const w = items[i];
    app(`<div class="play${pyOff()}"><div class=top><button class=back onclick="home()">✕</button><div class=bar><i style="width:${i / items.length * 100}%"></i></div>${pyBtn()}</div><div id=q></div><div id=fb></div></div>`);
    const m = mix ? mixMode(w) : mode;
    Q[m]($('#q'), w, (good, niv) => {
      grade(w.id, good, niv, PROD.has(m)); good ? ok++ : bad.push(w);
      const s = SENT[w.h];
      $('#fb').innerHTML = `<div class="fb ${good ? 'g' : 'b'}"><b style="font-size:1.4rem">${w.h}</b> <span class=py>${pc(w.p)}</span> — ${w.e} <button class=back onclick="say('${w.h}')">🔊</button>${s ? `<div class=mut style="margin-top:.3rem">${s[0]} · ${s[2]}<div class=py>${pc(s[1])}</div></div>` : ''}</div><button class=main id=nx>Siguiente</button>`;
      $('#nx').onclick = () => { i++; step(); };
    });
  };
  step();
}

}
function buildExam(lv) {
  const P = W.filter(w => w.l == lv), PS = P.filter(w => SENT[w.h]), used = new Set();
  const take = (a, n) => sample(a.filter(w => !used.has(w.id)), n).map(w => (used.add(w.id), w)); // sin repetir palabras en el examen
  const dis = (w, k) => shuffle([w, ...distinct(w, P, x => x[k])]);
  const hz = o => `<span class=hz2>${o.h}</span>`, Qs = [];
  const mk = (s, w, o) => Qs.push({ s, w, ...o });
  // 听力
  take(P, 5).forEach(w => mk(0, w, { audio: w.h, q: '¿Qué significa lo que oyes?', opts: dis(w, 'e'), lab: o => o.e }));
  if (PS.length >= 8) take(PS, 5).forEach(w => mk(0, w, { audio: SENT[w.h][0], q: 'Escucha la frase: ¿qué dice?', opts: shuffle([w, ...distinct(w, PS, x => SENT[x.h][2])]), lab: o => SENT[o.h][2] }));
  else take(P, 5).forEach(w => mk(0, w, { audio: w.h, q: '¿Qué palabra oyes?', opts: dis(w, 'h'), lab: hz }));
  // 阅读
  if (PS.length >= 8) take(PS, 5).forEach(w => { const s = SENT[w.h]; mk(1, w, { q: 'Completa la frase', html: `<span class=hz2 style="line-height:1.5">${s[0].replaceAll(w.h, '＿＿')}</span><small>${s[2]}</small>`, opts: dis(w, 'h'), lab: hz }); });
  else take(P, 5).forEach(w => mk(1, w, { q: '¿Qué significa?', html: `<span class=hz>${w.h}</span>`, opts: dis(w, 'e'), lab: o => o.e }));
  take(P, 5).forEach(w => mk(1, w, { q: '¿Cuál es el pinyin correcto?', html: `<span class=hz>${w.h}</span>`, opts: dis(w, 'p'), lab: o => o.p }));
  // 书写
  take(P, 5).forEach(w => mk(2, w, { q: 'Elige los caracteres correctos', html: `<b>${w.e}</b><small>${w.p}</small>`, opts: dis(w, 'h'), lab: hz }));
  take(P, 5).forEach(w => mk(2, w, { q: 'Escribe el pinyin', html: `<span class=hz>${w.h}</span><small>${w.e}</small>`, type: 1 }));
  return Qs;
}
function exam(lv) {
  GUARD = 'examen';
  const Qs = buildExam(lv), res = []; let i = 0, left = 30 * 60;
  const fin = () => {
    if (GUARD != 'examen') return; // ya terminó o salió
    clearInterval(TM); GUARD = '';
    const sc = [0, 1, 2].map(s => Math.round(Qs.filter((q, k) => q.s == s && res[k]).length / Qs.filter(q => q.s == s).length * 100)), tot = sc[0] + sc[1] + sc[2];
    S.exams.push({ d: day(new Date()), lv, s: sc }); S.exams = S.exams.slice(-30); save();
    const wrong = Qs.filter((q, k) => !res[k]);
    window.wrongW = [...new Map(wrong.map(q => [q.w.id, q.w])).values()];
    app(`<div style="text-align:center"><h1 style="justify-content:center">Resultado · HSK ${lv}</h1><div class=score>${tot}<span class=mut style="font-size:1.2rem"> / 300</span></div>
      <div style="margin:.8rem 0"><span class=stamp>${tot >= 180 ? '合格 · Aprobado' : '不合格 · Suspenso'}</span></div></div>
      ${sc.map((n, s) => `<div class=hbar><span style="width:9rem">${SECN[s].split(' · ')[0]}</span><div class=bar><i style="width:${n}%;${n >= 60 ? 'background:var(--ok)' : ''}"></i></div><b>${n}</b></div>`).join('')}
      ${wrong.length ? `<h2>Para repasar (${wrong.length})</h2><div class=list>${wrong.map(q => `<div><b>${q.w.h}</b><i>${q.w.p}</i><span>${q.w.e}</span></div>`).join('')}</div><button class=main onclick="session('choice',wrongW)">Practicar los fallos</button>` : '<p>¡Perfecto, ninguna falta!</p>'}
      <button class=opt style="margin-top:.5rem" onclick="exam(${lv})">Nuevo examen</button><button class=opt style="margin-top:.5rem" onclick="home()">Inicio</button>`, 'examMenu');
  };
  const next = good => { if (GUARD != 'examen') return; res[i] = good; i++; i < Qs.length ? show() : fin(); };
  const show = () => {
    const q = Qs[i];
    app(`<div class=play><div class=exh><span class=sec>${SECN[q.s]}</span><span class=tm id=tm></span></div>
      <div class=top><button class=back onclick="confirm('¿Salir del examen? Se perderá el progreso.')&&home()">✕</button><div class=bar><i style="width:${i / Qs.length * 100}%"></i></div><span class=mut>${i + 1}/${Qs.length}</span></div>
      <div class=prompt><b style="font-size:1rem;color:var(--mut)">${q.q}</b>${q.audio ? '<button class=main id=pl style="width:auto;margin:0 auto">🔊 Escuchar</button>' : ''}${q.html || ''}</div><div id=q></div></div>`);
    const tick = () => { $('#tm').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
    tick(); TM = setInterval(() => { left--; tick(); if (left <= 0) fin(); }, 1000);
    if (q.audio) { $('#pl').onclick = () => say(q.audio); setTimeout(() => say(q.audio), 300); }
    const el = $('#q');
    if (q.type) {
      el.innerHTML = `<input type=text id=in autocomplete=off autocapitalize=off autocorrect=off spellcheck=false aria-label="Escribe el pinyin" placeholder="pinyin (los tonos son opcionales)"><button class=main id=go>Siguiente</button>`;
      const go = () => next(nrm($('#in').value) == nrm(q.w.p));
      $('#go').onclick = go; $('#in').onkeydown = e => { if (e.key == 'Enter') go(); }; $('#in').focus();
    } else {
      el.innerHTML = '<div class=opts>' + q.opts.map(o => `<button class=opt>${q.lab(o)}</button>`).join('') + '</div>';
      [...el.querySelectorAll('.opt')].forEach((b, k, bs) => b.onclick = () => { bs.forEach(x => x.disabled = true); b.classList.add('pk'); setTimeout(() => next(q.opts[k] === q.w), 250); });
    }
  };
  show();
}

home();
if ('serviceWorker' in navigator) {
  const tenia = !!navigator.serviceWorker.controller; // en la primera instalación no avisamos
  // Aviso de versión nueva: se compara la V de sw.js (pedido siempre a la red) con la de este código. Así avisa en cuanto GitHub publica, sin esperar a que el service worker
  // descargue y active la versión, y no avisa si esta carga ya es la última (antes avisaba siempre que el service worker se actualizaba, aunque la página ya fuera nueva).
  const hayNueva = () => fetch('sw.js', { cache: 'no-store' }).then(r => r.text()).then(t => { const v = vSW(t); if (v && v != APP_V) $('#upd').hidden = false; }).catch(() => {});
  navigator.serviceWorker.register('sw.js').then(r => { navigator.serviceWorker.ready.then(x => x.active.postMessage('trazos')); // baja los datos de trazos una sola vez (se guardan aparte)
    const mira = () => { r.update().catch(() => {}); hayNueva(); }; document.addEventListener('visibilitychange', () => document.hidden || mira()); setInterval(() => document.hidden || mira(), 5 * 60 * 1000); setTimeout(hayNueva, 3000); }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tenia) hayNueva(); });
}
</script>
