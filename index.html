<style>

@media(prefers-color-scheme:dark){:root{--t1:#ff7b72;--t2:#e3a94a;--t3:#6fcf97;--t4:#6fa8ff;--t5:#a89580;--bg:#1a1210;--card:#261a16;--tx:#f0e4cf;--mut:#a89580;--pri:#d9534f;--gold:#d4a94a;--ok:#6fbf8b;--no:#e8776f;--okbg:#1f3526;--nobg:#4a2522;--bd:#3d2c24}}
:root[data-theme=dark]{--bg:#1a1210;--card:#261a16;--tx:#f0e4cf;--mut:#a89580;--pri:#d9534f;--gold:#d4a94a;--ok:#6fbf8b;--no:#e8776f;--okbg:#1f3526;--nobg:#4a2522;--bd:#3d2c24;--t1:#ff7b72;--t2:#e3a94a;--t3:#6fcf97;--t4:#6fa8ff;--t5:#a89580}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom));border-top:5px solid var(--pri);box-shadow:inset 0 3px 0 var(--gold);min-height:100vh}

@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{margin:1rem 0 .25rem;font-size:1.6rem;font-family:var(--serif);display:flex;align-items:center;gap:.6rem}

.mode{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:6px;padding:.85rem 1rem;margin:.5rem 0;transition:transform .1s}

.list div{display:flex;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--bd);align-items:baseline}

.lesson.done{border-color:var(--ok)} .lesson b{white-space:nowrap} .lesson span.p{color:var(--mut);margin-left:auto;font-size:1.1rem}
.study{border-radius:8px;padding:1.5rem 1rem;text-align:center;margin:1rem 0}
.study .hz{font-size:4.5rem} .study .py{font-size:1.6rem;margin:.3rem 0} .study .es{font-size:1.3rem}

.ex .zh{font-family:var(--serif);font-size:1.45rem;line-height:1.5} .ex .p2{color:var(--pri);font-size:1.05rem;margin:.3rem 0} .ex .mut{font-size:1rem}
.sk{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:.8rem;margin:.8rem 0;text-align:center}
.skbox{width:160px;height:160px;margin:0 auto .5rem;border:1px solid var(--bd);background:
 linear-gradient(var(--bd),var(--bd)) center/1px 100% no-repeat,linear-gradient(var(--bd),var(--bd)) center/100% 1px no-repeat}
.chart{width:100%;height:auto;font-size:9px;fill:var(--mut)}
.hbar{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;font-size:.9rem}
.hbar span:first-child{width:6.5rem;flex:none} .hbar .bar{height:10px} .hbar b{width:3.2rem;text-align:right;font-weight:600}
.exh{display:flex;justify-content:space-between;align-items:center;margin:.75rem 0}

.score{text-align:center;font-family:var(--serif);font-size:3.4rem;margin:.5rem 0 0;color:var(--pri)}
.stamp{display:inline-block;border:3px solid var(--pri);color:var(--pri);padding:.1rem .8rem;font:700 1.3rem var(--serif);transform:rotate(-6deg);border-radius:4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav[hidden]{display:none}
nav button{flex:1;background:none;border:0;padding:.55rem 0 .5rem;font-size:.75rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:.1rem}
nav button span{font-size:1.4rem;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
input[type=text],input[type=search]{width:100%;padding:.8rem;border-radius:6px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.1rem}

<script>
const $ = s => document.querySelector(s);
const TABS = [['home', '🏠', 'Inicio'], ['today', '📅', 'Hoy'], ['examMenu', '📝', 'Examen'], ['stats', '📊', 'Progreso']];
let TM = 0;
// botón atrás del móvil: desde cualquier pantalla vuelve al inicio (y no cierra la app)
let depth = 0, skipPop = false, GUARD = '';
addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; return; }
  depth = 0;
  if (GUARD && !confirm('¿Salir del examen? Se perderá el progreso.')) { history.pushState({ a: 1 }, ''); depth = 1; return; }
  GUARD = ''; home();
});
const app = (h, tab) => {
  clearInterval(TM);
  if (tab == 'home') { GUARD = ''; if (depth) { depth = 0; skipPop = true; history.back(); } }
  else if (!depth) { history.pushState({ a: 1 }, ''); depth = 1; }
  $('#app').innerHTML = h; scrollTo(0, 0);
  $('#nav').hidden = !tab;
  if (tab) $('#nav').innerHTML = TABS.map(t => `<button class="${t[0] == tab ? 'on' : ''}" onclick="${t[0]}()"><span>${t[1]}</span>${t[2]}</button>`).join('');
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const nrm = s => s.normalize('NFD').replace(/[̀-ͯ0-9\s'’·.-]/g, '').toLowerCase().replace(/v/g, 'u');
const say = t => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = S.set.rate; speechSynthesis.speak(u); } catch {} };

// --- datos: s='a' lista HSK 2.0, s='b' palabras añadidas del HSK 3.0 nuevo; pk = lección de 15 ---
const W = [], cnt = {};
function add(s, lv, l) {
  if (!l.trim() || l[0] == '#') return;
  const [h, p, e] = l.split('|'), k = s + lv; cnt[k] = cnt[k] || 0;
  W.push({ id: W.length, h, p, e: FIX[h] || e, l: lv, s, pk: k + '-' + (cnt[k]++ / 15 | 0) });
}
let lv0 = 0;
RAW.split('\n').forEach(l => { if (l[0] == '#') lv0 = +l.slice(1); else add('a', lv0, l); });
(self.NEW || []).forEach(([lv, t]) => t.split('\n').forEach(l => add('b', lv, l)));
// frases de ejemplo: palabra|frase|pinyin|español
const SENT = {};
(self.SENTR || []).forEach(t => t.split('\n').forEach(l => { const [h, ...r] = l.split('|'); if (r.length == 3) SENT[h] = r; }));

// --- pinyin: colores de tono y variantes de tono para practicar
const SYL = /(?:zh|ch|sh|[bpmfdtnlgkhjqxzcsryw])?[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+(?:ng|n)?/giu, TONE = {};
['āēīōūǖ', 'áéíóúǘ', 'ǎěǐǒǔǚ', 'àèìòùǜ'].forEach((cs, i) => [...cs].forEach(c => TONE[c] = i + 1));
const toneOf = t => { for (const c of t.toLowerCase()) if (TONE[c]) return TONE[c]; return 5; };
const pc = p => S.set.tones ? p.replace(SYL, m => `<span class=t${toneOf(m)}>${m}</span>`) : p;
const MARK = ['', '̄', '́', '̌', '̀'];
const setTone = (syl, t) => {
  const b = syl.normalize('NFD').replace(/[̄́̌̀]/g, '').normalize('NFC'); if (t == 5) return b;
  const l = b.toLowerCase(); let i = l.search(/[ae]/); if (i < 0) i = l.includes('ou') ? l.indexOf('o') : Math.max(...[...'iouü'].map(v => l.lastIndexOf(v)));
  return (b.slice(0, i + 1) + MARK[t] + b.slice(i + 1)).normalize('NFC');
};
function toneVars(p) { // variantes con otros tonos, para distinguirlos
  const ms = [...p.matchAll(SYL)], out = new Set();
  if (!ms.length) return [];
  for (let k = 0; k < 40 && out.size < 3; k++) {
    const pickI = new Set([Math.random() * ms.length | 0, Math.random() * ms.length | 0]); let r = '', last = 0;
    ms.forEach((m, i) => { r += p.slice(last, m.index); last = m.index + m[0].length; let t = toneOf(m[0]); if (pickI.has(i)) { do t = 1 + Math.random() * 4 | 0; while (t == toneOf(m[0])); } r += setTone(m[0], t); });
    r += p.slice(last); if (r != p) out.add(r);
  }
  return [...out];
}

// --- progreso (localStorage; si falla, la app sigue sin guardar) ---
let S = {}; try { S = JSON.parse(localStorage.hsk3) || {}; } catch {}
S.w = S.w || {}; S.packs = S.packs || {}; S.lv = S.lv || [1, 2, 3]; S.streak = S.streak || 0; S.last = S.last || '';
S.hist = S.hist || {}; S.exams = S.exams || []; S.exLv = S.exLv || 3; S.star = S.star || {};
S.set = Object.assign({ goal: 20, rate: .8, size: 100, theme: 'auto', tones: true }, S.set);
const applySet = () => { const r = document.documentElement; r.style.fontSize = S.set.size + '%'; S.set.theme == 'auto' ? r.removeAttribute('data-theme') : r.setAttribute('data-theme', S.set.theme); };
applySet();
const save = () => { try { localStorage.hsk3 = JSON.stringify(S); } catch {} };
const day = d => d.toLocaleDateString('sv');
const DAYS = [0, 1, 3, 7, 14, 30]; // repeticion espaciada: dias hasta el siguiente repaso por caja

function grade(id, ok) {
  const t = day(new Date()), r = S.w[id] || { b: 0, d: 0 };
  r.b = ok ? Math.min(5, r.b + 1) : 0; ok ? r.o = (r.o || 0) + 1 : r.f = (r.f || 0) + 1;
  r.d = Date.now() + DAYS[r.b] * 864e5; r.t = t;
  S.w[id] = r;
  const h = S.hist[t] = S.hist[t] || { n: 0, ok: 0 }; h.n++; if (ok) h.ok++;
  if (S.last != t) { S.streak = S.last == day(new Date(Date.now() - 864e5)) ? S.streak + 1 : 1; S.last = t; }
  save();
}
const sel = w => S.lv.includes(w.l);
const pool = () => W.filter(w => sel(w) && S.packs[w.pk]); // los juegos solo usan lo ya estudiado
const seen = () => W.filter(w => S.packs[w.pk]); // el repaso de hoy abarca todo lo estudiado, de cualquier HSK
const keysOf = l => [...new Set(W.filter(w => w.l == l).map(w => w.pk))]; // lecciones de un HSK, en orden
const lessonKeys = () => [...S.lv].sort().flatMap(keysOf), lessonNo = k => keysOf(+k[1]).indexOf(k) + 1;
// difíciles: marcadas con ⭐ o con más fallos que aciertos (y aún no dominadas)
const hardList = () => W.filter(w => { const r = S.w[w.id]; return S.star[w.id] || (r && (r.f || 0) >= 2 && r.f * 2 >= (r.o || 0) && r.b < 4); });
const LEVELS = [...new Set(W.map(w => w.l))].sort((a, b) => a - b);
const eod = () => new Date().setHours(23, 59, 59, 999);
// toca repasar hoy: nunca practicada, o vence hoy; lo fallado hoy no vuelve hasta mañana
const due = () => seen().filter(w => { const r = S.w[w.id]; return !r || (r.d <= eod() && !(r.b == 0 && r.t == day(new Date()))); });
function pick(n, f = () => 1) {
  const key = new Map(pool().filter(f).map(w => [w, (S.w[w.id]?.d || 0) + Math.random() * 1e6]));
  return [...key.keys()].sort((a, b) => key.get(a) - key.get(b)).slice(0, n);
}

// --- pantallas ---
const MODES = [
  ['match', '🔗', 'Emparejar', 'Une cada palabra con su traducción'],
  ['choice', '🎯', 'Elegir traducción', 'Hanzi → español y al revés'],
  ['cards', '🃏', 'Tarjetas', 'Mira, piensa y comprueba'],
  ['listen', '🎧', 'Escuchar', 'Oye la palabra y elige'],
  ['write', '⌨️', 'Escribir pinyin', 'Escribe la pronunciación'],
  ['cloze', '🧩', 'Completar la frase', 'Elige la palabra que falta'],
  ['sentence', '🗣️', 'Escuchar la frase', 'Oye una frase y elige su significado'],
  ['order', '🧱', 'Ordenar la frase', 'Construye la frase con sus palabras'],
  ['pinyin', '🔤', 'Elegir pinyin', 'Distingue los tonos'],
  ['hard', '🔥', 'Palabras difíciles', ''],
  ['hanzi', '🈶', 'Elegir hanzi', 'Significado → caracteres'],

// trocea una frase en palabras usando los espacios del pinyin (null si no cuadra con los hanzi)
const segCache = {};
function seg(w) {
  if (w.id in segCache) return segCache[w.id];
  const s = SENT[w.h]; let res = null;
  if (s) {
    const chars = [...s[0]], isP = c => /[，。？！、；：,.?!"“”]/.test(c); let i = 0, ok = true; const out = [];
    for (const t of s[1].split(/\s+/).filter(Boolean)) {
      let n = (t.match(SYL) || []).length; if (!n) continue;
      while (i < chars.length && isP(chars[i])) i++;
      let part = '';
      while (n > 0 && i < chars.length && !isP(chars[i])) { part += chars[i++]; n--; }
      if (n) { ok = false; break; }
      if (t.replace(SYL, '').replace(/[^a-z]/gi, '') == 'r' && chars[i] == '儿') part += chars[i++];
      out.push(part);
    }
    while (ok && i < chars.length) { if (isP(chars[i])) i++; else ok = false; }
    if (ok && out.join('') == chars.filter(c => !isP(c)).join('') && out.length >= 3 && out.length <= 8) res = out;
  }
  return segCache[w.id] = res;
}

    loadHW().then(() => {
      let fin = 0, bad = 0;
      cs.forEach((c, i) => HanziWriter.create('dw' + i, c, { width: 150, height: 150, padding: 8, showOutline: true, strokeColor: getComputedStyle(document.body).color, outlineColor: '#cdbd9a',
        onLoadCharDataError: () => $('#dm').textContent = 'Sin datos de trazos para ' + c })
        .quiz({ onMistake: () => bad++, onComplete: () => { if (++fin == cs.length) done(bad <= cs.length); } }));
    }).catch(() => $('#dm').textContent = 'Necesitas internet la primera vez para dibujar (sal con ✕ y prueba otro modo)');
  },
  choice(el, w, done) {
    const d = Math.random() < .5;
    el.innerHTML = `<div class=prompt>${d ? `<span class=hz>${w.h}</span>` : w.e}</div>`;
    opts(el, w, distract(w), o => d ? o.e : `<span class=hz2>${o.h}</span><small>${pc(o.p)}</small>`, done);
  },
  listen(el, w, done) {
    el.innerHTML = `<div class=prompt><button class=main style="width:auto;margin:0 auto" onclick="say('${w.h}')">🔊 Escuchar otra vez</button><small>¿Qué significa?</small></div>`;
    setTimeout(() => say(w.h), 300);
    opts(el, w, distract(w), o => o.e, done);
  },
  write(el, w, done) {
    el.innerHTML = `<div class=prompt><span class=hz>${w.h}</span><small>${w.e}</small></div>
      <input type=text id=in autocomplete=off autocapitalize=off placeholder="pinyin (los tonos son opcionales)"><button class=main id=go>Comprobar</button>`;
    const go = () => { if (!$('#in').value.trim()) return; $('#in').disabled = $('#go').disabled = true; done(nrm($('#in').value) == nrm(w.p)); };
    $('#go').onclick = go; $('#in').onkeydown = e => e.key == 'Enter' && go(); $('#in').focus();
  },
  cards(el, w, done) {
    el.innerHTML = `<div class=prompt><span class=hz>${w.h}</span></div><button class=main id=sh>Mostrar respuesta</button>`;
    $('#sh').onclick = () => {
      el.innerHTML = `<div class=prompt><span class=hz>${w.h}</span><span>${pc(w.p)}</span><b>${w.e}</b></div>
        <div class=row><button class=opt style="flex:1" id=ko>Otra vez</button><button class=opt style="flex:1" id=ok>Bien</button></div>`;
      say(w.h); $('#ko').onclick = () => done(false); $('#ok').onclick = () => done(true);
    };
  },
};
// en el repaso de hoy: ejercicio según la caja de la palabra
const mixMode = w => { const b = S.w[w.id]?.b || 0; return b <= 1 ? (Math.random() < .5 ? 'cards' : 'choice') : b < 4 ? (Math.random() < .5 ? 'listen' : 'choice') : (Math.random() < .5 ? 'write' : 'listen'); };

// items: palabras fijas (practica tras una lección); sin items, elige las que toca repasar; 'mix' = repaso de hoy
function session(mode, fixed) {
  const mix = mode == 'mix' || mode == 'hard';
  const items = fixed ? shuffle(fixed).slice(0, 10) : mode == 'hard' ? shuffle(hardList().sort((a, b) => (S.w[b.id]?.f || 0) - (S.w[a.id]?.f || 0)).slice(0, 15)) : mix ? due().sort((a, b) => (S.w[a.id]?.d || 0) - (S.w[b.id]?.d || 0)).slice(0, 20) : pick(10, FILT[mode]);
  if (!items.length) return empty();
  let i = 0, ok = 0; const bad = [];
  const step = () => {
    if (i >= items.length) return summary(ok, items.length, bad, () => mode == 'mix' ? today() : session(mode, fixed));
    const w = items[i];
    app(`<div class=top><button class=back onclick="home()">✕</button><div class=bar><i style="width:${i / items.length * 100}%"></i></div></div><div id=q></div><div id=fb></div>`);
    Q[mix ? mixMode(w) : mode]($('#q'), w, good => {
      grade(w.id, good); good ? ok++ : bad.push(w);
      const s = SENT[w.h];
      $('#fb').innerHTML = `<div class="fb ${good ? 'g' : 'b'}"><b style="font-size:1.4rem">${w.h}</b> ${pc(w.p)} — ${w.e} <button class=back onclick="say('${w.h}')">🔊</button>${s ? `<div class=mut style="margin-top:.3rem">${s[0]} · ${s[2]}</div>` : ''}</div><button class=main id=nx>Siguiente</button>`;
      $('#nx').onclick = () => { i++; step(); };
    });
  };
  step();
}

// contrarreloj: 60 segundos de preguntas de elegir traducción
function speed() {
  const items = shuffle(pool()); let i = 0, ok = 0, n = 0, left = 60; const bad = [];
  app(`<div class=exh><span class=sec>⏱️ Contrarreloj</span><span class=tm id=tm>60</span></div>
    <div class=top><button class=back onclick="home()">✕</button><div class=bar><i id=sb style="width:100%"></i></div><b id=sc>0</b></div><div id=q></div>`);
  const end = () => {
    clearInterval(TM);
    const best = S.best = Math.max(S.best || 0, ok); save();
    summary(ok, n, bad, speed);
    $('#app').insertAdjacentHTML('afterbegin', `<div class=mut>Récord: ${best} aciertos${ok >= best && ok ? ' 🏆 ¡nuevo!' : ''}</div>`);
  };
  const q = () => {
    if (left <= 0) return;
    const w = items[i++ % items.length];
    Q.choice($('#q'), w, good => { grade(w.id, good); n++; good ? ok++ : bad.push(w); $('#sc').textContent = ok; setTimeout(q, good ? 250 : 800); });
  };
  TM = setInterval(() => { left--; $('#tm').textContent = left; $('#sb').style.width = left / 60 * 100 + '%'; if (left <= 0) end(); }, 1000);
  q();
}

function matchGame(fixed) {
  const items = fixed ? shuffle(fixed).slice(0, 15) : pick(10), bad = [], rounds = Math.ceil(items.length / 5); let ok = 0, r = 0;
  const round = () => {
    if (r >= rounds) return summary(ok, items.length, bad, () => matchGame(fixed));
    const ws = items.slice(r * 5, r * 5 + 5), err = new Set(), R = shuffle(ws); let cur = null, left = ws.length;
    app(`<div class=top><button class=back onclick="home()">✕</button><div class=bar><i style="width:${r / rounds * 100}%"></i></div></div>
      <div class=match>${ws.map((w, i) => `<button class=cell data-i=${w.id} data-s=l><span class=hz2>${w.h}</span><small class=mut>${pc(w.p)}</small></button><button class=cell data-i=${R[i].id} data-s=r>${R[i].e}</button>`).join('')}</div>`);
    const word = id => ws.find(w => w.id == id);
    document.querySelectorAll('.cell').forEach(b => b.onclick = () => {
      if (b.dataset.s == 'l') say(word(b.dataset.i).h);
      if (!cur || cur.dataset.s == b.dataset.s) { cur?.classList.remove('sel'); cur = b; b.classList.add('sel'); return; }
      const a = cur; cur = null;
      if (a.dataset.i == b.dataset.i) {
        [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); x.disabled = true; });
        if (!--left) { ws.forEach(w => { const good = !err.has(w.id); grade(w.id, good); good ? ok++ : bad.push(w); }); setTimeout(() => { r++; round(); }, 600); }
      } else {
        err.add(+(a.dataset.s == 'l' ? a : b).dataset.i);
        [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('no', 'shake'); });
        setTimeout(() => [a, b].forEach(x => x.classList.remove('no', 'shake')), 450);
      }
    });
  };
  round();
}

function list() {
  const draw = q => {
    q = q.trim().toLowerCase();
    $('#l').innerHTML = W.filter(w => sel(w) && (!q || w.h.includes(q) || nrm(w.p).includes(nrm(q)) || w.e.toLowerCase().includes(q)))
      .map(w => `<div onclick="detail(${w.id})"><b>${w.h}</b><i>${pc(w.p)}</i><span>${w.e}</span><span class=box style="${(S.w[w.id]?.b || 0) >= 4 ? 'background:var(--ok)' : S.packs[w.pk] ? 'background:var(--pri)' : ''}"></span></div>`).join('');
  };
  app(`<div class=top><button class=back onclick="home()">←</button><input type=search id=s placeholder="Buscar hanzi, pinyin o español"></div><div class=list id=l></div>`);
  $('#s').oninput = e => draw(e.target.value); draw('');
}

// --- examen simulado (estilo HSK: 听力 / 阅读 / 书写, 100 puntos cada parte, aprobado 180/300) ---
const SECN = ['听力 · Comprensión auditiva', '阅读 · Comprensión lectora', '书写 · Escritura'];
function examMenu() {
  app(`<h1>Examen simulado</h1><div class=mut>30 preguntas · 30 minutos · 3 partes · aprobado con 180/300</div>
    <h3>HSK del examen</h3>
    <div class=row>${LEVELS.map(n => `<button class="chip ${S.exLv == n ? 'on' : ''}" onclick="S.exLv=${n};save();examMenu()">HSK ${n}</button>`).join('')}</div>
    <p class=mut>Usa solo el vocabulario de ese HSK, hayas estudiado las lecciones o no, y ninguna palabra se repite en el examen. Incluye frases de ejemplo en todos los HSK.</p>
    <button class=main onclick="exam(S.exLv)">Empezar examen</button>
    <h3>Últimos resultados</h3>
    ${S.exams.length ? S.exams.slice(-5).reverse().map(e => { const t = e.s[0] + e.s[1] + e.s[2]; return `<div class=hbar><span>${e.d} · HSK ${e.lv}</span><div class=bar><i style="width:${t / 3}%;${t >= 180 ? 'background:var(--ok)' : ''}"></i></div><b>${t}</b></div>`; }).join('') : '<p class=mut>Sin exámenes todavía.</p>'}`, 'examMenu');
}
function buildExam(lv) {
  const P = W.filter(w => w.l == lv), PS = P.filter(w => SENT[w.h]), used = new Set();
  const take = (a, n) => sample(a.filter(w => !used.has(w.id)), n).map(w => (used.add(w.id), w)); // sin repetir palabras en el examen
  const dis = (w, k) => shuffle([w, ...sample(P.filter(x => x.id != w.id && x[k] != w[k]), 3)]);
  const hz = o => `<span class=hz2>${o.h}</span>`, Qs = [];
  const mk = (s, w, o) => Qs.push({ s, w, ...o });
  // 听力
  take(P, 5).forEach(w => mk(0, w, { audio: w.h, q: '¿Qué significa lo que oyes?', opts: dis(w, 'e'), lab: o => o.e }));
  if (PS.length >= 8) take(PS, 5).forEach(w => mk(0, w, { audio: SENT[w.h][0], q: 'Escucha la frase: ¿qué dice?', opts: shuffle([w, ...sample(PS.filter(x => x.id != w.id), 3)]), lab: o => SENT[o.h][2] }));
  else take(P, 5).forEach(w => mk(0, w, { audio: w.h, q: '¿Qué palabra oyes?', opts: dis(w, 'h'), lab: hz }));
  // 阅读
  if (PS.length >= 8) take(PS, 5).forEach(w => { const s = SENT[w.h]; mk(1, w, { q: 'Completa la frase', html: `<span class=hz2 style="line-height:1.5">${s[0].replace(w.h, '＿＿')}</span><small>${s[2]}</small>`, opts: dis(w, 'h'), lab: hz }); });
  else take(P, 5).forEach(w => mk(1, w, { q: '¿Qué significa?', html: `<span class=hz>${w.h}</span>`, opts: dis(w, 'e'), lab: o => o.e }));
  take(P, 5).forEach(w => mk(1, w, { q: '¿Cuál es el pinyin correcto?', html: `<span class=hz>${w.h}</span>`, opts: dis(w, 'p'), lab: o => o.p }));
  // 书写
  take(P, 5).forEach(w => mk(2, w, { q: 'Elige los caracteres correctos', html: `<b>${w.e}</b><small>${w.p}</small>`, opts: dis(w, 'h'), lab: hz }));
  take(P, 5).forEach(w => mk(2, w, { q: 'Escribe el pinyin', html: `<span class=hz>${w.h}</span><small>${w.e}</small>`, type: 1 }));
  return Qs;
}
function exam(lv) {
  GUARD = 'examen';
  const Qs = buildExam(lv), res = []; let i = 0, left = 30 * 60;
  const fin = () => {
    clearInterval(TM); GUARD = '';
    const sc = [0, 1, 2].map(s => Math.round(Qs.filter((q, k) => q.s == s && res[k]).length / Qs.filter(q => q.s == s).length * 100)), tot = sc[0] + sc[1] + sc[2];
    S.exams.push({ d: day(new Date()), lv, s: sc }); S.exams = S.exams.slice(-30); save();
    const wrong = Qs.filter((q, k) => !res[k]);
    window.wrongW = [...new Map(wrong.map(q => [q.w.id, q.w])).values()];
    app(`<div style="text-align:center"><h1 style="justify-content:center">Resultado · HSK ${lv}</h1><div class=score>${tot}<span class=mut style="font-size:1.2rem"> / 300</span></div>
      <div style="margin:.8rem 0"><span class=stamp>${tot >= 180 ? '合格 · Aprobado' : '不合格 · Suspenso'}</span></div></div>
      ${sc.map((n, s) => `<div class=hbar><span style="width:9rem">${SECN[s].split(' · ')[0]}</span><div class=bar><i style="width:${n}%;${n >= 60 ? 'background:var(--ok)' : ''}"></i></div><b>${n}</b></div>`).join('')}
      ${wrong.length ? `<h3>Para repasar (${wrong.length})</h3><div class=list>${wrong.map(q => `<div><b>${q.w.h}</b><i>${q.w.p}</i><span>${q.w.e}</span></div>`).join('')}</div><button class=main onclick="session('choice',wrongW)">Practicar los fallos</button>` : '<p>¡Perfecto, ninguna falta! 🎉</p>'}
      <button class=opt style="margin-top:.5rem" onclick="exam(${lv})">Nuevo examen</button><button class=opt style="margin-top:.5rem" onclick="home()">Inicio</button>`, 'examMenu');
  };
  const next = good => { res[i] = good; i++; i < Qs.length ? show() : fin(); };
  const show = () => {
    const q = Qs[i];
    app(`<div class=exh><span class=sec>${SECN[q.s]}</span><span class=tm id=tm></span></div>
      <div class=top><button class=back onclick="confirm('¿Salir del examen? Se perderá el progreso.')&&home()">✕</button><div class=bar><i style="width:${i / Qs.length * 100}%"></i></div><span class=mut>${i + 1}/${Qs.length}</span></div>
      <div class=prompt><b style="font-size:1rem;color:var(--mut)">${q.q}</b>${q.audio ? '<button class=main id=pl style="width:auto;margin:0 auto">🔊 Escuchar</button>' : ''}${q.html || ''}</div><div id=q></div>`);
    const tick = () => { $('#tm').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
    tick(); TM = setInterval(() => { left--; tick(); if (left <= 0) fin(); }, 1000);
    if (q.audio) { $('#pl').onclick = () => say(q.audio); setTimeout(() => say(q.audio), 300); }
    const el = $('#q');
    if (q.type) {
      el.innerHTML = `<input type=text id=in autocomplete=off autocapitalize=off placeholder="pinyin (los tonos son opcionales)"><button class=main id=go>Siguiente</button>`;
      const go = () => next(nrm($('#in').value) == nrm(q.w.p));
      $('#go').onclick = go; $('#in').onkeydown = e => e.key == 'Enter' && go(); $('#in').focus();
    } else {
      el.innerHTML = '<div class=opts>' + q.opts.map(o => `<button class=opt>${q.lab(o)}</button>`).join('') + '</div>';
      [...el.querySelectorAll('.opt')].forEach((b, k, bs) => b.onclick = () => { bs.forEach(x => x.disabled = true); b.classList.add('pk'); setTimeout(() => next(q.opts[k] === q.w), 250); });
    }
  };
  show();
}

home();
if ('serviceWorker' in navigator) {
  const tenia = !!navigator.serviceWorker.controller; // en la primera instalación no avisamos
  navigator.serviceWorker.register('sw.js').then(r => { document.addEventListener('visibilitychange', () => document.hidden || r.update().catch(() => {})); }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tenia) $('#upd').hidden = false; });
}
</script>
